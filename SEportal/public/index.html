<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SEPNP 포털 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="stylesheet" href="assets/portal.css">
  <style>
    :root {
      --ink: #0f172a;
      --slate: #1f2937;
      --mist: #e2e8f0;
      --sand: #f5f1e8;
      --card: rgba(255, 255, 255, 0.9);
      --border: rgba(15, 23, 42, 0.12);
      --accent: #2563eb;
      --accent-2: #1d4ed8;
      --accent-3: #0b1b3a;
      --text: var(--ink);
      --text-muted: #6b7280;
      --error: #ef4444;
      --success: #10b981;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body.landing-page {
      font-family: "Pretendard Variable", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(1200px 800px at 12% 8%, rgba(37, 99, 235, 0.22), transparent 60%),
        radial-gradient(900px 600px at 88% 16%, rgba(56, 189, 248, 0.14), transparent 60%),
        linear-gradient(135deg, #0a1020 0%, #0b1b3a 40%, #0a2540 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
      position: relative;
      overflow: hidden;
    }

    body.landing-page::before,
    body.landing-page::after {
      content: '';
      position: fixed;
      inset: -30% 10% auto auto;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle at 30% 30%, rgba(37, 99, 235, 0.32), rgba(37, 99, 235, 0));
      filter: blur(20px);
      opacity: 0.6;
      z-index: 0;
      animation: drift 12s ease-in-out infinite;
    }

    body.landing-page::after {
      inset: auto auto -35% -10%;
      background: radial-gradient(circle at 40% 40%, rgba(56, 189, 248, 0.3), rgba(56, 189, 248, 0));
      animation-delay: -4s;
    }

    @keyframes drift {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-20px, 18px, 0) scale(1.04); }
    }
    
    .login-container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
    }
    
    .login-card {
      background: var(--card);
      border-radius: 22px;
      border: 1px solid var(--border);
      box-shadow: 0 30px 80px rgba(2, 6, 23, 0.35);
      padding: 44px 40px 36px;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
      background: rgba(248, 250, 252, 0.98);
      color: var(--slate);
      letter-spacing: 0.01em;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.18);
    }
    
    .btn {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 24px;
      box-shadow: 0 16px 30px rgba(37, 99, 235, 0.35);
      letter-spacing: 0.04em;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(29, 78, 216, 0.35);
    }

    .btn:active {
      transform: translateY(0);
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .alert {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
      letter-spacing: 0.02em;
    }

    .test-accounts code {
      background: rgba(15, 23, 42, 0.7);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: "IBM Plex Mono", "Consolas", monospace;
      color: #bfdbfe;
    }
    
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 18px 0;
      color: rgba(51, 65, 85, 0.6);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
    }

    .divider span {
      padding: 0 10px;
    }

    @media (max-width: 600px) {
      .login-card { padding: 34px 22px 26px; }
      .logo-text { font-size: 26px; }
      .form-control { height: 46px; }
    }
  </style>
</head>
<body class="landing-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <div class="logo-text">SEPNP</div>
          <div class="logo-subtitle">생산 관리 시스템</div>
        </div>
      </div>

      <div class="login-body">
        <div id="loginAlert" class="alert"></div>

        <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginId">아이디 또는 사번</label>
          <input 
            type="text" 
            id="loginId" 
            class="form-control" 
            placeholder="sepnp 또는 ADMIN"
            autocomplete="username" 
            required
          >
        </div>
        
        <div class="form-group">
          <label class="form-label" for="loginPassword">비밀번호</label>
          <input 
            type="password" 
            id="loginPassword" 
            class="form-control" 
            placeholder="비밀번호를 입력하세요"
            autocomplete="current-password" 
            required
          >
        </div>

        <button type="submit" class="btn" id="loginBtn">
          로그인
        </button>
        </form>

        <div class="divider">
          <span>또는</span>
        </div>

        <div class="links">
          <a href="register.html">회원가입</a>
          <div>
            <a class="home-link" href="http://sepnp0536.dothome.co.kr/index.html">홈으로</a>
          </div>
        </div>

        
      </div>
    </div>
  </div>

  <!-- API 모듈 먼저 로드 -->
  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/employee.page.js"></script>
</body>
</html>
