<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SEPNP 포털 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="stylesheet" href="assets/portal.css">
  <style>
    :root {
      --ink: #0f172a;
      --slate: #1f2937;
      --mist: #e2e8f0;
      --sand: #f5f1e8;
      --card: rgba(255, 255, 255, 0.9);
      --border: rgba(15, 23, 42, 0.12);
      --accent: #2563eb;
      --accent-2: #1d4ed8;
      --accent-3: #0b1b3a;
      --text: var(--ink);
      --text-muted: #6b7280;
      --error: #ef4444;
      --success: #10b981;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body.landing-page {
      font-family: "Pretendard Variable", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(1200px 800px at 12% 8%, rgba(37, 99, 235, 0.22), transparent 60%),
        radial-gradient(900px 600px at 88% 16%, rgba(56, 189, 248, 0.14), transparent 60%),
        linear-gradient(135deg, #0a1020 0%, #0b1b3a 40%, #0a2540 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
      position: relative;
      overflow: hidden;
    }

    body.landing-page::before,
    body.landing-page::after {
      content: '';
      position: fixed;
      inset: -30% 10% auto auto;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle at 30% 30%, rgba(37, 99, 235, 0.32), rgba(37, 99, 235, 0));
      filter: blur(20px);
      opacity: 0.6;
      z-index: 0;
      animation: drift 12s ease-in-out infinite;
    }

    body.landing-page::after {
      inset: auto auto -35% -10%;
      background: radial-gradient(circle at 40% 40%, rgba(56, 189, 248, 0.3), rgba(56, 189, 248, 0));
      animation-delay: -4s;
    }

    @keyframes drift {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-20px, 18px, 0) scale(1.04); }
    }
    
    .login-container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
    }
    
    .login-card {
      background: var(--card);
      border-radius: 22px;
      border: 1px solid var(--border);
      box-shadow: 0 30px 80px rgba(2, 6, 23, 0.35);
      padding: 44px 40px 36px;
      backdrop-filter: blur(8px);
      animation: rise 0.55s ease-out;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(22px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-header {
      display: grid;
      gap: 8px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
    }

    .login-body {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .logo {
      text-align: left;
      margin-bottom: 0;
      color: var(--ink);
    }

    .logo-text {
      font-size: 32px;
      font-weight: 700;
      font-family: "Noto Serif KR", serif;
      letter-spacing: 0.04em;
      line-height: 1.15;
      color: var(--ink);
    }

    .logo-subtitle {
      color: #475569;
      font-size: 13px;
      margin-top: 8px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    
    .form-group {
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeIn 0.5s ease-out both;
    }

    .form-group + .form-group {
      margin-top: 14px;
    }

    .form-group:nth-of-type(1) { animation-delay: 0.1s; }
    .form-group:nth-of-type(2) { animation-delay: 0.2s; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .form-label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      color: #334155;
      margin-bottom: 0;
      letter-spacing: 0.02em;
    }
    
    .form-control {
      width: 100%;
      height: 48px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      border-radius: 12px;
      padding: 0 16px;
      font-size: 15px;
      transition: all 0.2s;
      background: rgba(248, 250, 252, 0.98);
      color: var(--slate);
      letter-spacing: 0.01em;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.18);
    }
    
    .btn {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 24px;
      box-shadow: 0 16px 30px rgba(37, 99, 235, 0.35);
      letter-spacing: 0.04em;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(29, 78, 216, 0.35);
    }

    .btn:active {
      transform: translateY(0);
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .alert {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
      animation: drop 0.35s ease-out;
      line-height: 1.5;
    }

    @keyframes drop {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .alert.show {
      display: block;
    }
    
    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      color: #fecaca;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.12);
      color: #bbf7d0;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    
    .links {
      text-align: center;
      margin-top: 0;
      padding-top: 10px;
      border-top: 1px solid rgba(226, 232, 240, 0.15);
    }

    .links a {
      color: var(--accent-3);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .links a:hover {
      text-decoration: underline;
    }
    
    .test-accounts {
      margin-top: 18px;
      padding: 16px;
      background: #0b1b3a;
      border-radius: 14px;
      font-size: 12px;
      color: rgba(226, 232, 240, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      line-height: 1.7;
      width: 100%;
      box-shadow: 0 16px 30px rgba(2, 6, 23, 0.35);
    }

    .test-accounts h4 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #f8fafc;
      letter-spacing: 0.02em;
    }

    .test-accounts code {
      background: rgba(15, 23, 42, 0.7);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: "IBM Plex Mono", "Consolas", monospace;
      color: #bfdbfe;
    }
    
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 18px 0;
      color: rgba(51, 65, 85, 0.6);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
    }

    .divider span {
      padding: 0 10px;
    }

    @media (max-width: 600px) {
      .login-card { padding: 34px 22px 26px; }
      .logo-text { font-size: 26px; }
      .form-control { height: 46px; }
    }
  </style>
</head>
<body class="landing-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <div class="logo-text">SEPNP</div>
          <div class="logo-subtitle">생산 관리 시스템</div>
        </div>
      </div>

      <div class="login-body">
        <div id="loginAlert" class="alert"></div>

        <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginId">아이디 또는 사번</label>
          <input 
            type="text" 
            id="loginId" 
            class="form-control" 
            placeholder="sepnp 또는 ADMIN"
            autocomplete="username" 
            required
          >
        </div>
        
        <div class="form-group">
          <label class="form-label" for="loginPassword">비밀번호</label>
          <input 
            type="password" 
            id="loginPassword" 
            class="form-control" 
            placeholder="비밀번호를 입력하세요"
            autocomplete="current-password" 
            required
          >
        </div>

        <button type="submit" class="btn" id="loginBtn">
          로그인
        </button>
        </form>

        <div class="divider">
          <span>또는</span>
        </div>

        <div class="links">
          <a href="register.html">회원가입</a>
        </div>

        
      </div>
    </div>
  </div>

  <!-- API 모듈 먼저 로드 -->
  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
  
  <script>
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const loginAlert = document.getElementById('loginAlert');
    const loginIdInput = document.getElementById('loginId');
    const loginPasswordInput = document.getElementById('loginPassword');

    function showAlert(message, type = 'error') {
      loginAlert.textContent = message;
      loginAlert.className = `alert alert-${type} show`;
      
      setTimeout(() => {
        loginAlert.classList.remove('show');
      }, 4000);
    }

    // 서버 로그인
    async function loginWithServer(loginId, password) {
      try {
        const result = await API.login(loginId, password);
        if (result.ok) {
          sessionStorage.setItem('sepnp_emp_no', result.emp.empNo);
          sessionStorage.setItem('sepnp_emp_name', result.emp.name);
          sessionStorage.setItem('sepnp_emp_role', result.emp.role);
          sessionStorage.setItem('sepnp_emp_username', result.emp.username);
          if (result.emp.perms) {
            sessionStorage.setItem('sepnp_emp_perms', JSON.stringify(result.emp.perms));
          }
          showAlert('로그인 성공!', 'success');
          setTimeout(() => {
            window.location.href = 'employee.html';
          }, 500);
          return true;
        }
      } catch (error) {
        console.error('로그인 오류:', error);
        showAlert(error?.message || '로그인 실패', 'error');
        return false;
      }
    }

    // 로그인 폼 제출
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const loginId = loginIdInput.value.trim();
      const password = loginPasswordInput.value;
      
      if (!loginId || !password) {
        showAlert('ID와 비밀번호를 입력하세요.', 'error');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = '로그인 중...';
      const success = await loginWithServer(loginId, password);

      if (!success) {
        loginBtn.disabled = false;
        loginBtn.textContent = '로그인';
      }
    });

    // Enter 키 처리
    loginForm.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        loginBtn.click();
      }
    });

    // 페이지 로드 시
    window.addEventListener('DOMContentLoaded', () => {
      loginIdInput.focus();
      
      // 이미 로그인되어 있으면 리디렉션
      const empNo = sessionStorage.getItem('sepnp_emp_no');
      if (empNo) {
        window.location.href = 'employee.html';
      }

    });
  </script>
</body>
</html>
