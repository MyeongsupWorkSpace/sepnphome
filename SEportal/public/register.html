<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SEPNP 회원가입</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="stylesheet" href="assets/portal.css">
  <style>
    :root {
      --ink: #0f172a;
      --slate: #1f2937;
      --mist: #e2e8f0;
      --card: rgba(255, 255, 255, 0.9);
      --border: rgba(15, 23, 42, 0.12);
      --accent: #2563eb;
      --accent-2: #1d4ed8;
      --accent-3: #0b1b3a;
      --text: var(--ink);
      --text-muted: #6b7280;
      --error: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body.landing-page {
      font-family: "Pretendard Variable", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(1200px 800px at 12% 8%, rgba(37, 99, 235, 0.22), transparent 60%),
        radial-gradient(900px 600px at 88% 16%, rgba(56, 189, 248, 0.14), transparent 60%),
        linear-gradient(135deg, #0a1020 0%, #0b1b3a 40%, #0a2540 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
      position: relative;
      overflow: hidden;
    }
    body.landing-page::before,
    body.landing-page::after {
      content: '';
      position: fixed;
      inset: -30% 10% auto auto;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle at 30% 30%, rgba(37, 99, 235, 0.32), rgba(37, 99, 235, 0));
      filter: blur(20px);
      opacity: 0.6;
      z-index: 0;
      animation: drift 12s ease-in-out infinite;
    }
    body.landing-page::after {
      inset: auto auto -35% -10%;
      background: radial-gradient(circle at 40% 40%, rgba(56, 189, 248, 0.3), rgba(56, 189, 248, 0));
      animation-delay: -4s;
    }
    @keyframes drift {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-20px, 18px, 0) scale(1.04); }
    }

    .login-container {
      width: 100%;
      max-width: 560px;
      position: relative;
      z-index: 1;
    }
    .login-card {
      background: var(--card);
      border-radius: 22px;
      border: 1px solid var(--border);
      box-shadow: 0 30px 80px rgba(2, 6, 23, 0.35);
      padding: 40px 40px 34px;
      backdrop-filter: blur(8px);
      animation: rise 0.55s ease-out;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(22px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-header {
      display: grid;
      gap: 8px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
    }
    .logo { text-align: left; margin-bottom: 0; color: var(--ink); }
    .logo-text {
      font-size: 30px;
      font-weight: 700;
      font-family: "Noto Serif KR", serif;
      letter-spacing: 0.04em;
      line-height: 1.15;
      color: var(--ink);
    }
    .logo-subtitle {
      color: #475569;
      font-size: 12px;
      margin-top: 8px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .login-body {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .form-group {
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeIn 0.5s ease-out both;
    }
    .form-group:nth-of-type(1) { animation-delay: 0.1s; }
    .form-group:nth-of-type(2) { animation-delay: 0.2s; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .row-inline {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .row-inline .form-control { flex: 1; }
    .row-inline .btn {
      width: auto;
      height: 40px;
      margin-top: 0;
      padding: 0 16px;
      font-size: 13px;
      border-radius: 10px;
      box-shadow: none;
    }

    @media (max-width: 600px) {
      .login-card { padding: 34px 22px 26px; }
      .logo-text { font-size: 26px; }
      .form-control { height: 46px; }
      .row-inline { flex-direction: column; align-items: stretch; }
      .row-inline .btn { width: 100%; }
    }
  </style>
</head>
<body class="landing-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <div class="logo-text">SEPNP</div>
          <div class="logo-subtitle">회원가입 신청</div>
        </div>
      </div>

      <div class="login-body">
        <div id="registerAlert" class="alert"></div>

        <form id="registerForm">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="username">아이디</label>
              <div class="row-inline">
                <input class="form-control" id="username" name="username" placeholder="아이디" autocomplete="username" required>
                <button type="button" class="btn" id="btnCheckUsername">중복확인</button>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="name">이름</label>
              <input class="form-control" id="name" name="name" placeholder="이름" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="phone">연락처</label>
              <input class="form-control" id="phone" name="phone" placeholder="010-0000-0000">
            </div>
            <div class="form-group">
              <label class="form-label" for="dept">부서</label>
              <input class="form-control" id="dept" name="dept" placeholder="부서" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="email">이메일</label>
              <input class="form-control" id="email" name="email" type="email" placeholder="name@example.com">
            </div>
            <div class="form-group">
              <label class="form-label" for="password">비밀번호</label>
              <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
              <div class="hint">영문/숫자 조합 6자 이상 권장</div>
            </div>
            <div class="form-group">
              <label class="form-label" for="passwordConfirm">비밀번호 확인</label>
              <input class="form-control" id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required>
              <div class="field-error" id="passwordMismatchMsg">비밀번호가 일치하지 않습니다.</div>
            </div>
          </div>

          <button type="submit" class="btn" id="registerBtn">가입 신청</button>
        </form>

        <div class="links">
          <a href="index.html">로그인으로 돌아가기</a>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/register.page.js"></script>
</body>
</html>
