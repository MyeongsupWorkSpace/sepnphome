<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SEPNP 회원가입</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="stylesheet" href="assets/portal.css">
  <style>
    :root {
      --ink: #0f172a;
      --slate: #1f2937;
      --mist: #e2e8f0;
      --card: rgba(255, 255, 255, 0.9);
      --border: rgba(15, 23, 42, 0.12);
      --accent: #2563eb;
      --accent-2: #1d4ed8;
      --accent-3: #0b1b3a;
      --text: var(--ink);
      --text-muted: #6b7280;
      --error: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body.landing-page {
      font-family: "Pretendard Variable", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(1200px 800px at 12% 8%, rgba(37, 99, 235, 0.22), transparent 60%),
        radial-gradient(900px 600px at 88% 16%, rgba(56, 189, 248, 0.14), transparent 60%),
        linear-gradient(135deg, #0a1020 0%, #0b1b3a 40%, #0a2540 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
      position: relative;
      overflow: hidden;
    }
    body.landing-page::before,
    body.landing-page::after {
      content: '';
      position: fixed;
      inset: -30% 10% auto auto;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle at 30% 30%, rgba(37, 99, 235, 0.32), rgba(37, 99, 235, 0));
      filter: blur(20px);
      opacity: 0.6;
      z-index: 0;
      animation: drift 12s ease-in-out infinite;
    }
    body.landing-page::after {
      inset: auto auto -35% -10%;
      background: radial-gradient(circle at 40% 40%, rgba(56, 189, 248, 0.3), rgba(56, 189, 248, 0));
      animation-delay: -4s;
    }
    @keyframes drift {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-20px, 18px, 0) scale(1.04); }
    }

    .login-container {
      width: 100%;
      max-width: 560px;
      position: relative;
      z-index: 1;
    }
    .login-card {
      background: var(--card);
      border-radius: 22px;
      border: 1px solid var(--border);
      box-shadow: 0 30px 80px rgba(2, 6, 23, 0.35);
      padding: 40px 40px 34px;
      backdrop-filter: blur(8px);
      animation: rise 0.55s ease-out;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(22px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-header {
      display: grid;
      gap: 8px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
    }
    .logo { text-align: left; margin-bottom: 0; color: var(--ink); }
    .logo-text {
      font-size: 30px;
      font-weight: 700;
      font-family: "Noto Serif KR", serif;
      letter-spacing: 0.04em;
      line-height: 1.15;
      color: var(--ink);
    }
    .logo-subtitle {
      color: #475569;
      font-size: 12px;
      margin-top: 8px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .login-body {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .form-group {
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeIn 0.5s ease-out both;
    }
    .form-group:nth-of-type(1) { animation-delay: 0.1s; }
    .form-group:nth-of-type(2) { animation-delay: 0.2s; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .form-label { display: block; font-weight: 600; font-size: 13px; color: #334155; margin-bottom: 0; letter-spacing: 0.02em; }
    .form-control {
      width: 100%;
      height: 46px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      border-radius: 12px;
      padding: 0 14px;
      font-size: 14px;
      transition: all 0.2s;
      background: rgba(248, 250, 252, 0.98);
      color: var(--slate);
      letter-spacing: 0.01em;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.18);
    }
    .input-with-button {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .btn-inline {
      height: 46px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: #fff;
      color: #1e293b;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-inline:hover { transform: translateY(-1px); box-shadow: 0 8px 16px rgba(15, 23, 42, 0.12); }
    .btn-inline:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 24px;
      box-shadow: 0 16px 30px rgba(37, 99, 235, 0.35);
      letter-spacing: 0.04em;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 18px 36px rgba(29, 78, 216, 0.35); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .alert {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
      animation: drop 0.35s ease-out;
      line-height: 1.5;
    }
    @keyframes drop {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .alert.show { display: block; }
    .alert-error { background: rgba(239, 68, 68, 0.12); color: #fecaca; border: 1px solid rgba(239, 68, 68, 0.3); }
    .alert-success { background: rgba(16, 185, 129, 0.12); color: #bbf7d0; border: 1px solid rgba(16, 185, 129, 0.3); }
    .links { text-align: center; margin-top: 0; padding-top: 10px; border-top: 1px solid rgba(226, 232, 240, 0.15); }
    .links a { color: var(--accent-3); text-decoration: none; font-size: 14px; font-weight: 500; letter-spacing: 0.02em; }
    .hint { font-size: 12px; color: #64748b; margin-top: 6px; }
    .field-error { font-size: 12px; color: #dc2626; margin-top: 6px; display: none; }
    .field-error.show { display: block; }

    @media (max-width: 560px) {
      .form-grid { grid-template-columns: 1fr; }
      .login-card { padding: 34px 22px 26px; }
      .logo-text { font-size: 26px; }
      .form-control { height: 44px; }
    }
  </style>
</head>
<body class="landing-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <div class="logo-text">SEPNP 회원가입</div>
          <div class="logo-subtitle">승인 완료 후 로그인</div>
        </div>
      </div>

      <div class="login-body">
        <div id="registerAlert" class="alert"></div>

        <form id="registerForm">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="username">아이디</label>
            <div class="input-with-button">
              <input class="form-control" id="username" name="username" placeholder="아이디" autocomplete="username" required>
              <button type="button" class="btn-inline" id="btnCheckUsername">중복확인</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="name">이름</label>
            <input class="form-control" id="name" name="name" placeholder="이름" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="dept">부서</label>
            <input class="form-control" id="dept" name="dept" placeholder="부서" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">이메일</label>
            <input class="form-control" id="email" name="email" type="email" placeholder="name@example.com">
          </div>
          <div class="form-group">
            <label class="form-label" for="password">비밀번호</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
            <div class="hint">영문/숫자 조합 6자 이상 권장</div>
          </div>
          <div class="form-group">
            <label class="form-label" for="passwordConfirm">비밀번호 확인</label>
            <input class="form-control" id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required>
            <div class="field-error" id="passwordMismatchMsg">비밀번호가 일치하지 않습니다.</div>
          </div>
        </div>

        <button type="submit" class="btn" id="registerBtn">가입 신청</button>
        </form>

        <div class="links">
          <a href="index.html">로그인으로 돌아가기</a>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const btn = document.getElementById('registerBtn');
    const alertBox = document.getElementById('registerAlert');
    const btnCheckUsername = document.getElementById('btnCheckUsername');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const passwordConfirmInput = document.getElementById('passwordConfirm');
    const passwordMismatchMsg = document.getElementById('passwordMismatchMsg');
    let usernameChecked = false;
    let lastCheckedValue = '';
    let passwordMismatch = false;

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type} show`;
      setTimeout(() => alertBox.classList.remove('show'), 4000);
    }

    function validatePasswordMatch(showMessage = false) {
      const password = passwordInput.value;
      const confirm = passwordConfirmInput.value;
      if (!confirm) {
        passwordMismatch = false;
        btn.disabled = false;
        passwordMismatchMsg.classList.remove('show');
        return;
      }
      if (password !== confirm) {
        passwordMismatch = true;
        btn.disabled = true;
        if (showMessage) passwordMismatchMsg.classList.add('show');
        return;
      }
      passwordMismatch = false;
      btn.disabled = false;
      passwordMismatchMsg.classList.remove('show');
    }

    async function checkUsernameDuplicate() {
      const username = usernameInput.value.trim();
      if (!username) {
        showAlert('아이디를 입력하세요.');
        return;
      }

      btnCheckUsername.disabled = true;
      btnCheckUsername.textContent = '확인 중...';

      try {
        if (!window.API?.getEmployees) {
          throw new Error('중복 확인을 사용할 수 없습니다.');
        }
        const employees = await window.API.getEmployees();
        const pending = await window.API.getEmployees({ status: 'pending' });
        const exists = [...(employees || []), ...(pending || [])].some(e => e.username === username);

        if (exists) {
          usernameChecked = false;
          lastCheckedValue = '';
          showAlert('이미 사용 중인 아이디입니다.', 'error');
        } else {
          usernameChecked = true;
          lastCheckedValue = username;
          showAlert('사용 가능한 아이디입니다.', 'success');
        }
      } catch (err) {
        usernameChecked = false;
        lastCheckedValue = '';
        showAlert(err.message || '중복 확인 중 오류가 발생했습니다.');
      } finally {
        btnCheckUsername.disabled = false;
        btnCheckUsername.textContent = '중복확인';
      }
    }

    btnCheckUsername.addEventListener('click', checkUsernameDuplicate);
    usernameInput.addEventListener('input', () => {
      usernameChecked = false;
      lastCheckedValue = '';
    });
    passwordInput.addEventListener('input', () => validatePasswordMatch(false));
    passwordConfirmInput.addEventListener('input', () => validatePasswordMatch(false));
    passwordConfirmInput.addEventListener('blur', () => validatePasswordMatch(true));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const name = document.getElementById('name').value.trim();
      const dept = document.getElementById('dept').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('passwordConfirm').value;

      if (!username || !name || !dept || !password) {
        showAlert('필수 항목을 입력하세요.');
        return;
      }
      if (!usernameChecked || lastCheckedValue !== username) {
        showAlert('아이디 중복확인을 진행하세요.');
        return;
      }
      if (passwordMismatch || password !== passwordConfirm) {
        showAlert('비밀번호가 일치하지 않습니다.');
        return;
      }
      if (password !== passwordConfirm) {
        showAlert('비밀번호가 일치하지 않습니다.');
        return;
      }

      btn.disabled = true;
      try {
        const payload = {
          username,
          name,
          dept,
          email,
          password,
          status: 'pending',
          role: 'viewer',
          joinDate: new Date().toISOString().slice(0, 10)
        };

        if (!window.API?.registerEmployee) {
          throw new Error('회원가입 API를 사용할 수 없습니다.');
        }
        await window.API.registerEmployee(payload);
        showAlert('가입 신청이 완료되었습니다. 관리자 승인 후 로그인하세요.', 'success');
        setTimeout(() => { location.href = 'index.html'; }, 1200);
        return;
      } catch (err) {
        showAlert(err.message || '가입 중 오류가 발생했습니다.');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
