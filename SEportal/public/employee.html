  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
      background: #f5f6f8;
      color: #111;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    
    .welcome {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 48px 32px;
      border-radius: 16px;
      margin-bottom: 32px;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
    }
    
    .welcome h1 {
      margin: 0 0 12px;
      font-size: 32px;
      font-weight: 700;
    }
    
    .welcome p {
      margin: 0;
      font-size: 16px;
      opacity: 0.95;
    }
    
    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 20px;
      color: #333;
    }
    
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .menu-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }
    
    .menu-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
      transform: scaleY(0);
      transition: transform 0.2s ease;
    }
    
    .menu-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      border-color: #667eea;
    }
    
    .menu-card:hover::before {
      transform: scaleY(1);
    }
    
    .menu-card-icon {
      font-size: 32px;
      line-height: 1;
    }
    
    .menu-card-title {
      font-size: 18px;
      font-weight: 600;
      color: #111;
      margin: 0;
    }
    
    .menu-card-desc {
      font-size: 14px;
      color: #666;
      margin: 0;
      line-height: 1.5;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    
    .stat-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .stat-label {
      font-size: 13px;
      color: #666;
      font-weight: 500;
    }
    
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #111;
    }
    
    .stat-card.primary .stat-value {
      color: #667eea;
    }
