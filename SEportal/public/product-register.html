<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>제품 등록</title>
  <link rel="stylesheet" href="assets/nav.css">
  <style>
  :root{
    --ctl-h:34px; --ctl-r:10px; --ctl-fs:14px;
    --bd:#e5e7eb; --fg:#0f172a; --mut:#6b7280; --bg:#f6f7fb; --card:#fff; --primary:#1e3a8a;
    --shadow:0 8px 24px rgba(16,24,40,.08);
    --dimw-min:90px; --dimw-max:110px; --selectW:180px;
  }
  *{box-sizing:border-box}
  body{margin:0;padding-top:60px;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  
  .container{max-width:1440px;margin:0 auto;padding:24px}
  h2{margin:0 0 18px;font-size:24px;font-weight:800;letter-spacing:-0.2px}
  
  .topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
  
  .btn{height:var(--ctl-h);padding:0 14px;font-size:var(--ctl-fs);border-radius:var(--ctl-r);border:1px solid var(--bd);background:#fff;cursor:pointer;font-weight:600;box-shadow:0 2px 6px rgba(16,24,40,.06);transition:all .2s ease;display:inline-flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0}
  .btn:hover{background:#f8fafc;transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(135deg,var(--primary),#0f2f70);border-color:var(--primary);color:#fff}
  .btn.primary:hover{filter:brightness(1.02)}
  
  .grid{display:grid;gap:18px}
  .grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media(max-width:1100px){.grid.cols-2{grid-template-columns:1fr}}
  .span-2{grid-column:1 / -1}
  
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
  .card-title{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--fg)}
  
  .form-row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .form-row label{min-width:92px;font-weight:600;font-size:var(--ctl-fs);color:#334155}
  .form-row .field{flex:1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .spec-row .field{flex-wrap:wrap;white-space:normal}
  .vendor-row .field{flex-wrap:nowrap;white-space:nowrap;min-width:0}
  .vendor-row .inp{min-width:0}
  
  .inp,.sel,textarea{height:var(--ctl-h);border:1px solid var(--bd);border-radius:var(--ctl-r);background:#fff;font-size:var(--ctl-fs);padding:0 12px;line-height:1;transition:border-color 0.2s, box-shadow 0.2s}
  .inp:focus,.sel:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,58,138,.12)}
  .sel{min-width:var(--selectW)}

  .dim-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dim-input{display:flex;align-items:center;gap:6px}
  .dim-input .inp{min-width:var(--dimw-min);max-width:var(--dimw-max)}
  .unit{font-size:12px;color:var(--mut)}

  .process-options{display:flex;gap:8px;flex-wrap:wrap}
  .process-options label{display:flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:999px;padding:4px 10px;background:#fff;font-size:12px}
  .process-detail{width:100%}
  .process-item{border:1px dashed var(--bd);border-radius:10px;padding:12px;margin-bottom:10px;background:#f8fafc}
  .process-item-title{font-weight:700;margin-bottom:8px}
  .process-summary{list-style:none;padding:0;margin:0;display:flex;gap:8px;flex-wrap:wrap}
  .process-summary li{border:1px solid var(--bd);border-radius:999px;padding:6px 10px;font-size:12px;background:#fff}
  .process-summary .empty{color:var(--mut)}

  .upload-area{border:2px dashed var(--bd);border-radius:12px;padding:18px;text-align:center;background:#fff;cursor:pointer;transition:border-color .2s, background .2s}
  .upload-area.dragover{border-color:var(--primary);background:#f1f5ff}
  .file-list{margin-top:12px;display:grid;gap:8px}
  .file-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff}
  .file-item-name{font-size:12px;color:#334155}
  .file-item-remove{cursor:pointer;color:#ef4444;font-weight:700}

  .modal{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
  .modal.show{display:flex}
  .panel{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:20px;min-width:320px;max-width:720px;width:100%;box-shadow:var(--shadow)}
  .panel h3{margin:0 0 12px;font-size:18px;font-weight:800}
  .modal-tabs{display:flex;gap:6px;margin-bottom:12px}
  .modal-tab{border:1px solid var(--bd);border-radius:999px;padding:6px 12px;background:#fff;cursor:pointer;font-size:12px;font-weight:700}
  .modal-tab.active{background:#e0e7ff;border-color:#a5b4fc;color:#1e3a8a}
  .modal-section{display:none}
  .modal-section.active{display:block}
  .modal-form{display:grid;gap:10px}
  .mini{font-size:12px;color:var(--mut)}
  </style>
</head>
<body>
  <header class="fixed-header"></header>

  <main class="container" data-perm="product.view" data-perm-mode="hide">
    <div class="topbar">
      <h2>제품 등록</h2>
      <button type="submit" form="productForm" class="btn primary">등록</button>
    </div>

    <form id="productForm" class="grid cols-2">
      <section class="card">
        <div class="card-title">기본 정보</div>
        <div class="form-row vendor-row">
          <label>거래처</label>
          <div class="field">
            <input id="prodVendor" class="inp" placeholder="거래처 선택" readonly>
            <button type="button" id="btnVendorModal" class="btn">관리</button>
          </div>
        </div>
        <div class="form-row">
          <label>제품명</label>
          <div class="field"><input id="prodName" class="inp" placeholder="제품명"></div>
        </div>
        <div class="form-row spec-row">
          <label>규격</label>
          <div class="field dim-group">
            <div class="dim-input"><input id="prodL" class="inp" type="number" placeholder="가로"><span class="unit">mm</span></div>
            <span>×</span>
            <div class="dim-input"><input id="prodW" class="inp" type="number" placeholder="세로"><span class="unit">mm</span></div>
            <span>×</span>
            <div class="dim-input"><input id="prodH" class="inp" type="number" placeholder="높이"><span class="unit">mm</span></div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-title">용지/합지</div>
        <div class="form-row">
          <label>용지</label>
          <div class="field">
            <select id="prodPaper" class="sel"></select>
            <button type="button" id="btnAddPaper" class="btn">용지 추가</button>
          </div>
        </div>
        <div class="form-row spec-row">
          <label>용지 규격</label>
          <div class="field dim-group">
            <div class="dim-input"><input id="paperW" class="inp" type="number" placeholder="가로"><span class="unit">mm</span></div>
            <span>×</span>
            <div class="dim-input"><input id="paperH" class="inp" type="number" placeholder="세로"><span class="unit">mm</span></div>
          </div>
        </div>
        <div class="form-row">
          <label>합지 없음</label>
          <div class="field">
            <label style="display:flex;align-items:center;gap:6px">
              <input id="noLaminate" type="checkbox"> 없음
            </label>
          </div>
        </div>
        <div class="form-row">
          <label>합지</label>
          <div class="field">
            <select id="prodLaminate" class="sel"></select>
            <button type="button" id="btnAddLaminate" class="btn">용지 추가</button>
          </div>
        </div>
        <div class="form-row spec-row">
          <label>합지 규격</label>
          <div class="field dim-group">
            <div class="dim-input"><input id="lamW" class="inp" type="number" placeholder="가로"><span class="unit">mm</span></div>
            <span>×</span>
            <div class="dim-input"><input id="lamH" class="inp" type="number" placeholder="세로"><span class="unit">mm</span></div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-title">가격/칼선</div>
        <div class="form-row">
          <label>단가</label>
          <div class="field"><input id="prodPrice" class="inp" type="number" placeholder="원"></div>
        </div>
        <div class="form-row">
          <label>절수</label>
          <div class="field"><input id="prodCut" class="inp" type="number" placeholder="절수"></div>
        </div>
        <div class="form-row spec-row">
          <label>칼선 규격</label>
          <div class="field dim-group">
            <div class="dim-input"><input id="knifeW" class="inp" type="number" placeholder="가로"><span class="unit">mm</span></div>
            <span>×</span>
            <div class="dim-input"><input id="knifeH" class="inp" type="number" placeholder="세로"><span class="unit">mm</span></div>
          </div>
        </div>
      </section>

      <section class="card span-2">
        <div class="card-title">공정 선택</div>
        <div class="form-row">
          <label>공정</label>
          <div class="field process-options">
            <label><input type="checkbox" name="process" value="인쇄"> 인쇄</label>
            <label><input type="checkbox" name="process" value="코팅"> 코팅</label>
            <label><input type="checkbox" name="process" value="금박"> 금박</label>
            <label><input type="checkbox" name="process" value="형압"> 형압</label>
            <label><input type="checkbox" name="process" value="합지"> 합지</label>
            <label><input type="checkbox" name="process" value="톰슨"> 톰슨</label>
            <label><input type="checkbox" name="process" value="접착"> 접착</label>
          </div>
        </div>
        <div class="form-row">
          <label>상세 입력</label>
          <div class="field">
            <div id="processDetailArea" class="process-detail"></div>
          </div>
        </div>
        <div class="form-row">
          <label>공정 요약</label>
          <div class="field">
            <ul id="processSummary" class="process-summary"></ul>
          </div>
        </div>
        <div class="form-row">
          <label></label>
          <div class="field">
            <button type="button" id="btnRegisterProcess" class="btn primary">공정 등록</button>
          </div>
        </div>
      </section>

      <section class="card span-2">
        <div class="card-title">파일 업로드</div>
        <input id="fileInput" type="file" multiple hidden>
        <div id="fileUploadArea" class="upload-area">
          파일을 드래그하거나 클릭하여 업로드하세요.
        </div>
        <div id="fileList" class="file-list"></div>
      </section>
    </form>
  </main>

  <div id="vendorModal" class="modal">
    <div class="panel">
      <h3>거래처 관리</h3>
      <div class="modal-tabs" id="vendorTabs">
        <button type="button" class="modal-tab active" data-tab="search">검색</button>
        <button type="button" class="modal-tab" data-tab="create">신규 등록</button>
      </div>

      <div class="modal-section active" data-section="search">
        <div class="form-row">
          <label>검색</label>
          <div class="field"><input id="vendorSearch" class="inp" placeholder="거래처명 검색"></div>
        </div>
        <div id="vendorList" style="max-height:300px;overflow:auto;border:1px solid var(--bd);border-radius:8px;margin:12px 0"></div>
      </div>

      <div class="modal-section" data-section="create">
        <div class="modal-form">
          <div class="form-row">
            <label>거래처명</label>
            <div class="field"><input id="vendorNameInput" class="inp" placeholder="거래처명"></div>
          </div>
          <div class="form-row">
            <label>담당자</label>
            <div class="field"><input id="vendorContactInput" class="inp" placeholder="담당자명"></div>
          </div>
          <div class="form-row">
            <label>연락처</label>
            <div class="field"><input id="vendorPhoneInput" class="inp" placeholder="010-0000-0000"></div>
          </div>
        </div>
      </div>

      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" id="btnVendorAdd" class="btn">저장</button>
        <button type="button" id="btnVendorClose" class="btn primary">닫기</button>
      </div>
    </div>
  </div>

  <div id="paperModal" class="modal">
    <div class="panel">
      <h3>용지 등록</h3>
      <div class="modal-form">
        <div class="form-row">
          <label>용지</label>
          <div class="field"><input id="paperTypeInput" class="inp" placeholder="예: SC IV RIV AB"></div>
        </div>
        <div class="form-row">
          <label>평량</label>
          <div class="field"><input id="paperWeightInput" class="inp" placeholder="예: 350"></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" id="btnPaperCancel" class="btn">취소</button>
        <button type="button" id="btnPaperSave" class="btn primary">저장</button>
      </div>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/product-register.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/product-register.page.js"></script>
</body>
</html>
