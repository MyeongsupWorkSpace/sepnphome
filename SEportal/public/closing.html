<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ERP | 월마감</title>
<style>
:root{
  --bg:#f4f6f8;--panel:#fff;--line:#e5e7eb;--text:#172033;--muted:#6b7280;
  --nav:#18212f;--nav2:#202b3c;--primary:#2563eb;--success:#16a34a;--warn:#d97706;--danger:#dc2626;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif;font-size:14px}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
.sidebar{background:var(--nav);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:18px;font-weight:800;line-height:1.3;padding:4px 10px 20px;border-bottom:1px solid #334155;margin-bottom:12px}
.brand small{display:block;color:#94a3b8;font-size:11px;margin-top:5px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:12px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.nav button:hover,.nav button.active{background:var(--nav2);color:#fff}.main{padding:26px;max-width:1600px;width:100%;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.page-title h1{font-size:23px;margin:0 0 5px}.page-title p{margin:0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:7px;padding:10px 13px;font-weight:700;cursor:pointer;background:#e5e7eb;color:#1f2937}.btn.primary{background:var(--primary);color:#fff}.btn.green{background:var(--success);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.small{padding:6px 9px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.02)}.grid{display:grid;gap:15px}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.metric .label{color:var(--muted);font-size:12px}.metric .num{font-size:26px;font-weight:800;margin-top:7px}.metric .hint{color:#64748b;font-size:12px;margin-top:5px}
section.view{display:none}section.view.active{display:block}.stack{display:grid;gap:16px}.section-title{font-size:16px;margin:0 0 13px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:760px;background:#fff}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#f8fafc;color:#475569;font-size:12px}tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:700}.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.badge.danger{background:#fee2e2;color:#991b1b}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.form .wide{grid-column:span 2}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:#475569;font-weight:700}input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:7px;padding:10px;background:#fff;font:inherit}textarea{min-height:80px;resize:vertical}.form-actions{display:flex;align-items:flex-end;gap:8px}
.kpi-row{display:flex;gap:8px;flex-wrap:wrap}.progress{height:10px;border-radius:999px;background:#e5e7eb;overflow:hidden;min-width:120px}.progress>span{display:block;height:100%;background:var(--primary)}
.notice{padding:11px 13px;border-radius:8px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}.empty{padding:28px;text-align:center;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.42);align-items:center;justify-content:center;padding:18px;z-index:4}.modal.show{display:flex}.modal-box{background:#fff;max-width:980px;width:100%;max-height:90vh;overflow:auto;border-radius:12px;padding:20px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.modal-head h2{margin:0;font-size:18px}
.footer-note{color:var(--muted);font-size:12px;margin-top:10px}
@media(max-width:1100px){.grid.four{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:repeat(2,1fr)}}
@media(max-width:780px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap}.main{padding:16px}.grid.four,.grid.two,.form{grid-template-columns:1fr}.form .wide{grid-column:span 1}.topbar{flex-direction:column}.sidebar{padding:14px}.brand{padding-bottom:12px}}

/* 제품사양서 ERP 참고 레이아웃 */
.spec-shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;min-height:720px}
.spec-left{display:grid;grid-template-rows:auto minmax(260px,1fr) 150px;gap:12px}
.spec-filter{padding:13px}
.spec-filter .field{margin-bottom:8px}
.spec-list{padding:0;overflow:hidden}
.spec-list-head{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border-bottom:1px solid var(--line);font-weight:800}
.spec-item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.spec-item:hover,.spec-item.active{background:#eff6ff}
.spec-item b{display:block;font-size:13px}.spec-item small{display:block;color:var(--muted);margin-top:3px}
.spec-history{padding:0;overflow:hidden}.spec-history .section-title{padding:12px 13px;margin:0;border-bottom:1px solid var(--line)}
.spec-main{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:14px}
.spec-head{display:grid;grid-template-columns:1.2fr 1.2fr .9fr .9fr;gap:10px;align-items:end}
.spec-head .full{grid-column:span 2}
.spec-body{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:14px}
.spec-process-card{padding:0;overflow:hidden}
.spec-process-title{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800;background:#f8fafc}
.process-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.proc-row{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.proc-row:nth-child(odd){border-right:1px solid var(--line)}
.proc-row label{font-weight:800;font-size:12px;color:#334155}
.spec-side{display:grid;gap:12px}
.preview-box{border:1px solid var(--line);border-radius:10px;min-height:230px;display:flex;align-items:center;justify-content:center;background:#fafafa;color:#94a3b8;font-weight:800}
.spec-bottom{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.spec-section{border:1px solid var(--line);border-radius:10px;padding:13px}
.spec-section h3{font-size:13px;margin:0 0 11px;color:#334155}
.compact-field{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.compact-field label{font-size:12px;color:#475569;font-weight:700}
@media(max-width:1100px){.spec-shell{grid-template-columns:1fr}.spec-left{grid-template-rows:auto auto auto}.spec-body{grid-template-columns:1fr}.spec-side{grid-template-columns:1fr 1fr}.spec-head{grid-template-columns:repeat(2,minmax(0,1fr))}.spec-bottom{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.spec-head,.spec-bottom{grid-template-columns:1fr}.spec-head .full{grid-column:span 1}.process-grid{grid-template-columns:1fr}.proc-row:nth-child(odd){border-right:0}.spec-side{grid-template-columns:1fr}}


/* v4 제품사양 입력폼 정렬 개선 */
.product-form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.product-form-grid .span2{grid-column:span 2}
.product-form-grid .span4{grid-column:span 4}
.inline-control{display:flex;gap:7px;align-items:center;min-width:0}
.inline-control select,.inline-control input{min-width:0;flex:1}
.inline-control .btn{flex:0 0 auto;white-space:nowrap}
.stock-mode{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fafafa}
.stock-mode label{font-size:12px;color:#334155;font-weight:700}
.dynamic-options{display:flex;gap:7px;align-items:center}
.dynamic-options select{flex:1;min-width:0}
@media(max-width:780px){.product-form-grid{grid-template-columns:1fr}.product-form-grid .span2,.product-form-grid .span4{grid-column:span 1}}


/* v7 로그인 및 저장이력 */
.login-overlay{display:none;position:fixed;inset:0;z-index:20;background:linear-gradient(135deg,#172033,#2563eb);align-items:center;justify-content:center;padding:18px}
.login-overlay.show{display:flex}.login-card{width:min(420px,100%);background:#fff;border-radius:16px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-card h1{margin:0 0 7px;font-size:23px}.login-card p{margin:0 0 18px;color:#64748b}.login-card .field{margin-bottom:12px}
.user-chip{display:inline-flex;gap:7px;align-items:center;padding:8px 10px;border:1px solid #dbe3ee;border-radius:999px;background:#fff;font-size:12px;font-weight:700}
.audit-box{margin-top:12px;padding:10px 12px;border:1px solid #dbeafe;background:#eff6ff;border-radius:8px;font-size:12px;color:#1e3a8a}


/* v12 workflow */
.workflow-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.workflow-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#f8fafc;border-bottom:1px solid var(--line)}
.workflow-steps{display:grid;grid-template-columns:repeat(8,minmax(125px,1fr));overflow:auto}
.workflow-step{min-width:125px;padding:12px;border-right:1px solid var(--line);position:relative}
.workflow-step:last-child{border-right:0}.workflow-step.done{background:#f0fdf4}.workflow-step.active{background:#eff6ff}.workflow-step.locked{background:#fafafa;color:#94a3b8}
.workflow-step .step-name{font-weight:800;margin-bottom:7px}.workflow-step .step-meta{font-size:12px;color:#64748b;margin:7px 0}.workflow-step .arrow{position:absolute;right:-8px;top:50%;transform:translateY(-50%);z-index:2;background:#fff;border-radius:50%;color:#94a3b8;font-size:16px}
.role-note{padding:10px 12px;border:1px solid #fde68a;background:#fffbeb;color:#92400e;border-radius:8px;font-size:12px}


/* v14 호기 작업배정 */
.machine-grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px}
.machine-card h3{margin:0 0 12px;font-size:16px}
.queue-table tr.selected td{background:#eff6ff}
.machine-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.machine-meta .metric-mini{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fafafa}
.machine-meta .metric-mini small{display:block;color:#64748b}
.machine-meta .metric-mini b{display:block;margin-top:4px;font-size:16px}
.assignment-banner{padding:12px 14px;border-radius:9px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8}
.partner-list{display:flex;gap:8px;flex-wrap:wrap}
.partner-chip{border:1px solid #dbe3ee;border-radius:999px;padding:6px 9px;background:#fff;font-size:12px}
.machine-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(max-width:1000px){.machine-grid{grid-template-columns:1fr}.machine-meta{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* v15 설비 편성 보드 */
.equip-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}
.equip-box{border:1px solid var(--line);border-radius:10px;padding:13px;cursor:pointer;background:#fff;min-height:125px;transition:.15s}
.equip-box:hover{border-color:#93c5fd;transform:translateY(-1px)}
.equip-box.selected{border:2px solid var(--primary);background:#eff6ff}
.equip-box.busy{background:#fff7ed;border-color:#fdba74}
.equip-box .machine-name{font-weight:800;font-size:14px}.equip-box .machine-process{font-size:12px;color:#64748b;margin:5px 0 10px}
.equip-box .machine-worker{font-size:12px;color:#334155;line-height:1.5}
.shift-line{border-top:1px solid var(--line);padding-top:9px;margin-top:9px;font-size:12px;color:#475569}
.assignment-panel{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
@media(max-width:900px){.assignment-panel{grid-template-columns:1fr}}


/* v16 설비 공정 구획 */
.machine-group-board{display:grid;gap:16px}
.machine-group{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafafa}
.machine-group-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.machine-group-title h3{margin:0;font-size:15px}
.machine-group-title span{font-size:12px;color:#64748b}
.machine-group .equip-board{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}


/* v19 기장 중심 작업지시 / 제품 공정추적 */
.captain-work-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px}
.current-machine-panel{padding:16px;border:1px solid #bfdbfe;border-radius:11px;background:#eff6ff}
.current-machine-panel h3{margin:0 0 10px}.work-info-list{display:grid;gap:8px}
.work-info-item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(37,99,235,.15)}
.work-info-item:last-child{border-bottom:0}.queue-action{display:flex;justify-content:flex-end;margin-top:10px}
.trace-card{border:1px solid var(--line);border-radius:11px;padding:14px;background:#fff}
.trace-steps{display:flex;gap:0;overflow:auto;margin-top:10px}
.trace-step{min-width:145px;flex:1;padding:11px;border:1px solid var(--line);border-right:0;background:#fafafa;position:relative}
.trace-step:last-child{border-right:1px solid var(--line)}.trace-step.done{background:#f0fdf4}.trace-step.active{background:#eff6ff}.trace-step.wait{background:#fafafa;color:#94a3b8}
.trace-step b{display:block;margin-bottom:5px}.trace-step small{display:block;line-height:1.45}
.trace-filter{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
@media(max-width:1000px){.captain-work-grid{grid-template-columns:1fr}}


/* v20 포장완료 입고·설비 현황 */
.machine-current-work{margin-top:8px;padding:7px 8px;border-radius:7px;background:rgba(37,99,235,.07);font-size:12px;line-height:1.45}
.machine-current-work.busy{background:#fff1e8;color:#9a3412}
.machine-current-work.idle{background:#f1f5f9;color:#64748b}
.warehouse-choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.warehouse-option{border:1px solid var(--line);border-radius:9px;padding:12px;cursor:pointer;background:#fff}
.warehouse-option:hover{border-color:#93c5fd;background:#eff6ff}
.warehouse-option input{margin-right:7px}


/* v22 생산현황 설비표·작업지시 검색 */
.work-search-bar{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.work-search-bar .field{min-width:280px;flex:1}


/* v23 설비 카드 클릭 상세 모달 */
.machine-detail-modal .modal-box{max-width:1180px}
.machine-modal-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.machine-modal-header{padding:14px;border:1px solid #bfdbfe;border-radius:10px;background:#eff6ff}
.machine-modal-header h3{margin:0 0 8px}
@media(max-width:850px){.machine-modal-layout{grid-template-columns:1fr}}


/* v24 작업 오배정 대응 */
.recovery-note{padding:10px 12px;border:1px solid #fecaca;background:#fef2f2;color:#991b1b;border-radius:8px;font-size:12px;margin-top:10px}


/* v27 전문 사원관리 */
.employee-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.employee-kpi{padding:14px;border:1px solid var(--line);background:#fff;border-radius:10px}
.employee-kpi b{display:block;font-size:22px;margin-top:5px}
.employee-tools{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.employee-tools .field{min-width:220px;flex:1}
.emp-name-cell{display:flex;align-items:center;gap:10px}
.emp-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e0ecff;color:#1d4ed8;font-weight:800}
.emp-sub{font-size:11px;color:#64748b;margin-top:2px}
.emp-tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#f1f5f9;font-size:11px;margin:2px 3px 0 0}
.emp-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.emp-detail-item{padding:10px;border:1px solid var(--line);border-radius:8px;background:#fafafa}
.emp-detail-item span{display:block;font-size:11px;color:#64748b;margin-bottom:4px}
@media(max-width:800px){.employee-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.emp-detail-grid{grid-template-columns:1fr}}


/* v28 역할 기반 권한관리 */
.permission-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.permission-option{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;font-size:13px}
.permission-option input{margin-right:6px}
.role-pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}
.permission-summary{font-size:12px;color:#64748b;line-height:1.5}
@media(max-width:800px){.permission-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* v32 전문가형 매출분석 */
.analysis-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.analysis-card{padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff}
.analysis-card .label{font-size:12px;color:#64748b}.analysis-card .value{font-size:24px;font-weight:800;margin-top:6px}
.analysis-card .sub{font-size:12px;color:#64748b;margin-top:6px}
.analysis-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
.analysis-insight{padding:13px;border:1px solid #bfdbfe;border-radius:10px;background:#eff6ff;line-height:1.6}
.analysis-insight.warn{border-color:#fde68a;background:#fffbeb}
.analysis-insight.danger{border-color:#fecaca;background:#fef2f2}
.bar-list{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:120px 1fr 95px;gap:8px;align-items:center;font-size:13px}
.bar-track{height:12px;border-radius:999px;background:#e2e8f0;overflow:hidden}.bar-fill{height:100%;background:#2563eb;border-radius:999px}
@media(max-width:900px){.analysis-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.analysis-layout{grid-template-columns:1fr}.bar-row{grid-template-columns:100px 1fr 85px}}


/* v34 UI polish */
:root{--navy:#172554;--blue:#2563eb;--blue-soft:#eff6ff;--ink:#0f172a;--muted:#64748b;--surface:#fff;--line:#e2e8f0;--bg:#f6f8fc}
*{box-sizing:border-box}
body{background:var(--bg)!important;color:var(--ink)!important;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",Arial,sans-serif!important;letter-spacing:-.15px}
.sidebar{background:linear-gradient(180deg,#0f1f44 0%,#172554 45%,#1e3a8a 100%)!important;box-shadow:10px 0 30px rgba(15,23,42,.08)}
.brand{padding:24px 20px 18px!important;border-bottom:1px solid rgba(255,255,255,.12)}
.brand h1{font-size:20px!important;font-weight:850!important;letter-spacing:-.8px}
.brand:after{content:"통합 생산 · 영업 · 재고 관리";display:block;margin-top:7px;color:rgba(255,255,255,.66);font-size:11px;letter-spacing:0}
#nav{padding:14px 10px 20px!important}
#nav button{position:relative;border-radius:10px!important;margin:3px 0!important;padding:11px 12px!important;transition:.18s ease!important;color:rgba(255,255,255,.78)!important;font-size:13px!important;text-align:left!important}
#nav button:hover{background:rgba(255,255,255,.11)!important;color:#fff!important;transform:translateX(2px)}
#nav button.active{background:#fff!important;color:#1d4ed8!important;font-weight:800!important;box-shadow:0 7px 16px rgba(15,23,42,.16)}
#nav button.active:before{content:"";position:absolute;left:-10px;top:10px;bottom:10px;width:3px;border-radius:5px;background:#60a5fa}
.main{padding:26px 30px 40px!important}
.topbar{background:transparent!important;margin-bottom:18px!important}
.topbar h2{font-size:26px!important;font-weight:850!important;letter-spacing:-1px}
.topbar p{color:var(--muted)!important;margin-top:5px!important}
#userChip{background:#fff!important;border:1px solid var(--line)!important;border-radius:999px!important;padding:9px 12px!important;box-shadow:0 3px 10px rgba(15,23,42,.04)}
.card,.trace-card,.analysis-card,.employee-kpi{border:1px solid rgba(226,232,240,.95)!important;box-shadow:0 5px 16px rgba(15,23,42,.045)!important;border-radius:14px!important}
.card{background:#fff!important;padding:18px!important}
.section-title{font-size:16px!important;font-weight:850!important;display:flex;align-items:center;gap:8px}
.section-title:before{content:"";width:4px;height:18px;border-radius:99px;background:var(--blue);display:inline-block}

<script>
const appName="printflow_erp_v1";
const ERP_STATE_API=new URL("/api/erp_state.php", window.location.origin).toString();
let syncTimer=null;
let syncInFlight=false;
let syncQueued=false;
const menus=[
  ["dashboard","대시보드","전체 현황과 오늘의 업무"],

  ["products","제품사양서","규격·원지·후가공·포장 사양"],
  ["orders","수주오더등록","고객 주문과 납기 관리"],
  ["work","작업지시","공정별 작업지시서 발행"],
  ["printplan","인쇄 계획표","인쇄 1·2·3호기 일정 편성"],
  ["machine","작업배정","설비별 기장·파트너·대기풀 관리"],
  ["trace","제품 공정추적","제품별 공정 진행·완료 이력"],
  ["shipping","출고 / 납품","출고·납품 이력 관리"],
  ["inventory","재고관리","완제품 재고 및 창고 관리"],
  ["materials","부자재관리","원지·원단·부자재 재고 관리"],
  ["sales","매출관리","거래처별 매출 및 수금"],
  ["salesanalysis","매출분석","전문가형 매출·수금·거래처 분석"],
  ["employees","사원관리","부서·직책·인력 현황"],
  ["users","권한관리","가입 계정·역할·메뉴 권한 관리"],
  ["closing","월마감","월별 생산·매출 마감"]
];
const processList=["인쇄","코팅","합지","톰슨","금박","형압","접착","포장"];
function demo(){
 return {
 users:[
  {id:"김명섭",password:"100200",name:"김명섭",dept:"개발자",role:"관리자",leaderOf:["인쇄","코팅","금박","형압","합지","톰슨","접착","포장"]}
 ],
 customers:[],
 paperTypes:["SC","RIV","IV","AB","AB라이트","BV"],
 stockTypes:["B골","E골","F골","G골","단면","양면","기타"],
 warehouses:["미래정밀창고","기숙사창고","가족사랑창고","기타"],
 products:[],
 orders:[],
 work:[],
 production:[],
 shipping:[],
 inventory:[],
 sales:[],
 employees:[],
 closing:[]
 }}
function persistLocal(state){localStorage.setItem(appName,JSON.stringify(state))}
function getDB(){let raw=localStorage.getItem(appName);if(!raw){let d=demo();persistLocal(d);return d}try{return JSON.parse(raw)}catch(e){return demo()}}
function ensureDbShape(state){
 const sample=demo();
 const keys=Object.keys(sample);
 keys.forEach((key)=>{if(state[key]===undefined)state[key]=sample[key]});
 return state;
}
function saveDB(db){persistLocal(db);scheduleServerSync()}
function scheduleServerSync(){
 if(syncTimer)clearTimeout(syncTimer);
 syncTimer=setTimeout(()=>{void pushStateToServer()},500);
}
function flushServerSync(){
 if(syncTimer){
  clearTimeout(syncTimer);
  syncTimer=null;
 }
 if(syncInFlight){
  syncQueued=true;
  return;
 }
 void pushStateToServer();
}
function sendStateByBeacon(){
 if(!db||!navigator.sendBeacon)return false;
 try{
  const body=JSON.stringify({state:db});
  const blob=new Blob([body],{type:"application/json"});
  return navigator.sendBeacon(ERP_STATE_API,blob);
 }catch(e){
  return false;
 }
}
async function pushStateToServer(){
 if(syncInFlight){syncQueued=true;return;}
 syncInFlight=true;
 try{
  await fetch(ERP_STATE_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({state:db})});
 }catch(e){
  console.warn("ERP 상태 저장 실패",e);
 }finally{
  syncInFlight=false;
  if(syncQueued){syncQueued=false;scheduleServerSync();}
 }
}
async function pullStateFromServer(){
 try{
  const res=await fetch(`${ERP_STATE_API}?_=${Date.now()}`,{cache:"no-store"});
  if(!res.ok)return;
  const payload=await res.json();
  if(payload&&payload.ok&&payload.state&&typeof payload.state==="object"){
   if(Object.keys(payload.state).length===0)return;
   db=ensureDbShape(payload.state);
   persistLocal(db);
   nav();
   render();
  }
 }catch(e){
  console.warn("ERP 상태 조회 실패",e);
 }
}
window.addEventListener("pagehide",()=>{
 if(sendStateByBeacon())return;
 flushServerSync();
});
window.addEventListener("beforeunload",()=>{
 if(sendStateByBeacon())return;
 flushServerSync();
});
function resolveInitialPage(){
 const allowed=menus.map(x=>x[0]);
 const byBody=(document.body?.dataset?.defaultPage||"").trim();
 if(byBody&&allowed.includes(byBody))return byBody;
 const qp=new URLSearchParams(location.search).get("page");
 if(qp&&allowed.includes(qp))return qp;
 const file=(location.pathname.split("/").pop()||"index.html").toLowerCase();
 const byFile={
  "dashboard.html":"dashboard",
  "production.html":"dashboard",
  "products.html":"products",
  "orders.html":"orders",
  "work.html":"work",
  "printplan.html":"printplan",
  "machine.html":"machine",
  "trace.html":"trace",
  "shipping.html":"shipping",
  "inventory.html":"inventory",
  "materials.html":"materials",
  "sales.html":"sales",
  "salesanalysis.html":"salesanalysis",
  "employees.html":"employees",
  "users.html":"users",
  "closing.html":"closing"
 };
 return byFile[file]||"dashboard";
}
let db=ensureDbShape(getDB()), active=resolveInitialPage();

const ROLE_PRESETS={
 "관리자":{menus:"ALL",label:"전체 관리 권한"},
 "경영관리자":{menus:["dashboard","trace","shipping","inventory","materials","sales","salesanalysis","employees","closing"],label:"현황·마감·조회 관리"},
 "영업관리자":{menus:["dashboard","products","orders","work","trace","shipping","inventory","sales","salesanalysis"],label:"제품·수주·매출·납품 관리"},
 "생산관리자":{menus:["dashboard","work","printplan","machine","trace","inventory","materials"],label:"생산·설비·재고 관리"},
 "인쇄 기장":{menus:["dashboard","work","printplan","machine","trace"],label:"인쇄 공정 작업 처리"},
 "코팅 기장":{menus:["dashboard","work","machine","trace"],label:"코팅 · 금박 · 형압 공정 작업 처리"},
 "합지 기장":{menus:["dashboard","work","machine","trace"],label:"합지 공정 작업 처리"},
 "톰슨 기장":{menus:["dashboard","work","machine","trace"],label:"톰슨 공정 작업 처리"},
 "접착 기장":{menus:["dashboard","work","machine","trace"],label:"접착 · 포장 공정 작업 처리"},
 "물류관리자":{menus:["dashboard","shipping","inventory","materials","trace"],label:"입출고·창고 관리"},
 "조회전용":{menus:["dashboard","trace","inventory","materials","shipping","sales","salesanalysis"],label:"조회만 가능"}
};
const CAPTAIN_ROLE_PROCESSES={
 "인쇄 기장":["인쇄"],
 "코팅 기장":["코팅","금박","형압"],
 "합지 기장":["합지"],
 "톰슨 기장":["톰슨"],
 "접착 기장":["접착","포장"]
};
function captainProcessesForRole(role){return CAPTAIN_ROLE_PROCESSES[role]||[];}

const MENU_LABELS={
 dashboard:"대시보드",products:"제품사양서",orders:"수주오더등록",
 work:"작업지시",printplan:"인쇄 계획표",machine:"작업배정",trace:"제품 공정추적",shipping:"출고 / 납품",
 inventory:"재고관리",materials:"부자재관리",sales:"매출관리",salesanalysis:"매출분석",employees:"사원관리",
 users:"권한관리",closing:"월마감"
};
function getUserPermissions(user){
 if(!user)return [];
 if(user.role==="관리자") return menus.map(x=>x[0]);
 if(Array.isArray(user.permissions)&&user.permissions.length) return user.permissions;
 return ROLE_PRESETS[user.role]?.menus==="ALL"?menus.map(x=>x[0]):(ROLE_PRESETS[user.role]?.menus||["dashboard"]);
}
function canAccessMenu(menuId){
 const u=currentUser();
 return !!u && getUserPermissions(u).includes(menuId);
}
function canEditSystem(){
 const u=currentUser(); return !!u && ["관리자","경영관리자","영업관리자","생산관리자","물류관리자"].includes(u.role);
}
function canManageUsers(){return currentUser()?.role==="관리자";}
function isReadOnly(){return currentUser()?.role==="조회전용";}
function permissionLabel(user){
 const p=getUserPermissions(user);
 return user.role==="관리자"?"전체 메뉴":`${p.length}개 메뉴`;
}

function currentUser(){try{return JSON.parse(sessionStorage.getItem("printflow_current_user")||"null")}catch(e){return null}}
function currentUserDisplayName(){const u=currentUser();return u?`${u.id}(${u.dept})-${u.role}`:"미로그인"}
function currentUserName(){const u=currentUser();return u?.id||"미로그인"}
function updateUserChip(){const el=document.getElementById("userChip");if(el)el.textContent="👤 "+currentUserDisplayName()}
function auditNew(obj){const now=new Date().toLocaleString("ko-KR");const u=currentUserName();obj.createdBy=u;obj.createdAt=now;obj.updatedBy=u;obj.updatedAt=now;return obj}
function auditUpdate(obj,old){const now=new Date().toLocaleString("ko-KR");const u=currentUserName();obj.createdBy=(old&&old.createdBy)||u;obj.createdAt=(old&&old.createdAt)||now;obj.updatedBy=u;obj.updatedAt=now;return obj}
function defaultUsers(){
 return [
  {id:"김명섭",password:"100200",name:"김명섭",dept:"개발자",role:"관리자",leaderOf:["인쇄","코팅","금박","형압","합지","톰슨","접착","포장"]}
 ];
}
function login(){
 const id=(document.getElementById("loginId").value||"").trim();
 const pw=document.getElementById("loginPw").value||"";
 if(!db.users || !db.users.length){
   db.users=defaultUsers();
   saveDB(db);
 }
 const user=db.users.find(x=>x.id===id&&x.password===pw);

function statusBadge(s){let c=s.includes("완료")||s==="재직"?"ok":s.includes("대기")||s.includes("미수")||s.includes("부분")?"warn":s.includes("지연")?"danger":"";return `<span class="badge ${c}">${s}</span>`}

const WORKFLOW_ORDER=["인쇄","코팅","금박","형압","합지","톰슨","접착","포장"];
function productWorkflow(productName){
 const product=db.products.find(x=>x.name===productName)||{};
 const p=product.process||{};
 const map={인쇄:"print",코팅:"coating",금박:"foil",형압:"emboss",합지:"lamination",톰슨:"diecut",접착:"glue"};
 let flow=WORKFLOW_ORDER.filter(n=>n!=="포장" && !!p[map[n]]);
 if(!flow.length){
   const legacy=[product.finish,product.processText,product.note].filter(Boolean).join(" ").toLowerCase();
   const match={인쇄:["인쇄","옵셋","uv"],코팅:["코팅","cr","라미","z코팅"],금박:["금박","박"],형압:["형압"],합지:["합지"],톰슨:["톰슨"],접착:["접착"]};
   flow=WORKFLOW_ORDER.filter(n=>n!=="포장" && match[n].some(word=>legacy.includes(word)));
 }
 return flow.length?[...flow,"포장"]:[];
}
function canManageProcess(process){
 const u=currentUser(); if(!u)return false;
 const captainProcesses=captainProcessesForRole(u.role);
 return ["관리자","생산관리자"].includes(u.role) || captainProcesses.includes(process) || (u.leaderOf||[]).includes(process);
}
function stageBadge(s){return `<span class="badge ${s==="완료"?"ok":s==="준비"?"warn":""}">${s}</span>`}
function normalizeWorkflow(order){
 const desired=productWorkflow(order.product);
 if(!desired.length){order.workflow=[];return order.workflow;}
 const existing=Object.fromEntries((order.workflow||[]).map(x=>[x.process,x]));
 const baseQty=Number(order.sheetQty||order.qty||0);
 order.workflow=desired.map((process,i)=>existing[process]||({process,stage:i===0?"준비":"대기",inputQty:i===0?baseQty:0,completedQty:0,completedBy:"",completedAt:"",note:""}));
 const firstOpen=order.workflow.findIndex(x=>x.stage!=="완료");
 order.workflow.forEach((step,i)=>{if(i>firstOpen && step.stage!=="완료")step.stage="대기";});
 if(firstOpen>=0 && order.workflow[firstOpen].stage==="대기")order.workflow[firstOpen].stage="준비";
 return order.workflow;
}
function ensureWorkflow(order){return normalizeWorkflow(order);}
function openStep(orderIndex,stepIndex){
 const order=db.orders[orderIndex], flow=ensureWorkflow(order), step=flow[stepIndex];
 const first=flow.findIndex(x=>x.stage!=="완료");
 if(!canManageProcess(step.process)){alert(`${step.process} 공정 부서장 또는 관리자만 변경할 수 있습니다.`);return}
 if(stepIndex!==first&&step.stage!=="완료"){alert("이전 공정 완료 후 진행할 수 있습니다.");return}
 openModal(`${order.id} · ${step.process} 공정`, `<form class="form" onsubmit="saveStep(${orderIndex},${stepIndex});return false">
 <div class="field"><label>공정</label><input value="${step.process}" readonly></div>
 <div class="field"><label>현재 상태</label><input value="${step.stage}" readonly></div>
 <div class="field"><label>변경 상태</label><select id="wfStage"><option>준비</option><option>진행</option><option>완료</option></select></div>
 <div class="field"><label>완료 수량</label><input id="wfQty" type="number" min="0" value="${step.completedQty||""}" placeholder="완료 시 필수"></div>
 <div class="field wide"><label>인계 메모</label><textarea id="wfNote" placeholder="불량, 특이사항, 다음 공정 전달사항"></textarea></div>
 <div class="role-note wide">완료 시 완료수량을 반드시 입력해야 하며, 수량은 다음 공정 투입수량으로 자동 인계됩니다.</div>
 <div class="form-actions"><button class="btn primary" type="submit">저장</button></div></form>`);
}
function saveStep(orderIndex,stepIndex){
 const order=db.orders[orderIndex], flow=ensureWorkflow(order), step=flow[stepIndex];
 const stage=v("wfStage"), qty=Number(v("wfQty"))||0;
 if(stage==="완료"&&qty<=0){alert("완료 처리 시 완료수량을 입력하세요.");return}

  step.completedQty=qty; step.completedBy=currentUserName(); step.completedAt=new Date().toLocaleString("ko-KR"); step.note=v("wfNote");

  else openWarehouseReceive(order,qty,"work");
  return;
 }
 auditUpdate(order,order);saveDB(db);closeModal();render();
}

}

function printMachineList(){return machines().filter(m=>["PRINT-1","PRINT-2","PRINT-3"].includes(m.id));}
function currentPrintPlanDate(){return window.printPlanDate||new Date().toISOString().slice(0,10);}
function printableQueue(){
 return db.orders.filter(o=>o.status!=="입고완료"&&o.status!=="납품완료").map((order,orderIndex)=>{
   const flow=ensureWorkflow(order);
   const stepIndex=flow.findIndex(s=>s.stage!=="완료");
   return {order,orderIndex,step:flow[stepIndex],stepIndex};
 }).filter(x=>x.step&&x.step.process==="인쇄"&&["준비","대기"].includes(x.step.stage));
}
function planForOrder(orderId){return printPlans().find(p=>p.orderId===orderId&&p.status==="계획");}
function planDateLabel(date){return date||"일자 미지정";}
function plansInLane(machineId,planDate=currentPrintPlanDate(),excludeId=""){
 return printPlans().filter(p=>p.status==="계획"&&p.machineId===machineId&&(p.planDate||planDate)===planDate&&p.id!==excludeId)
  .sort((a,b)=>{
   const ao=Number(a.sortOrder||0),bo=Number(b.sortOrder||0);
   if(ao&&bo&&ao!==bo)return ao-bo;
   if(ao&&!bo)return -1;
   if(!ao&&bo)return 1;
   return String(a.createdAt||a.id||"").localeCompare(String(b.createdAt||b.id||""));
  });
}
function resequencePrintLane(machineId,planDate,plans){

}
function appendPlanToLane(plan,machineId,planDate){

 if(!machine)return;
 plan.machineId=machine.id;

 plan.planDate=planDate;

}
function insertPlanBefore(plan,machineId,planDate,beforeOrderId){

 if(targetIndex<0)lane.push(plan);else lane.splice(targetIndex,0,plan);

function printPostProcessSummary(order){
 const flow=ensureWorkflow(order);
 const product=db.products.find(p=>p.name===order.product)||{};
 const p=product.process||{};
 const printIndex=flow.findIndex(s=>s.process==="인쇄");
 const after=flow.slice(printIndex>=0?printIndex+1:0).map(s=>{
   if(s.process==="코팅") return p.coatingType||"코팅";
   if(s.process==="금박") return p.foilSize?`금박(${p.foilSize})`:"금박";
   if(s.process==="형압") return p.embossSize?`형압(${p.embossSize})`:"형압";
   if(s.process==="합지") return p.laminationType||"합지";
   if(s.process==="톰슨") return p.diecutType||"톰슨";
   if(s.process==="접착") return p.glueType||"접착";
   return s.process;
 });
 return after.length?after.join(" · "):"후공정 없음";
}
function printDueAlert(due){
 if(!due) return {text:"",className:"safe",urgent:false};
 const base=new Date(); base.setHours(0,0,0,0);
 const target=new Date(`${due}T00:00:00`);
 if(Number.isNaN(target.getTime())) return {text:"",className:"safe",urgent:false};
 const diff=Math.round((target-base)/86400000);
 if(diff<0) return {text:`🚨 납기 경과 ${Math.abs(diff)}일`,className:"",urgent:true};
 if(diff===0) return {text:"🚨 납기 오늘",className:"today",urgent:true};
 if(diff<=3) return {text:`🚨 납기 D-${diff}`,className:"",urgent:true};
 return {text:"",className:"safe",urgent:false};
}

function savePrintPlanAssignment(orderId){
 const order=db.orders.find(o=>o.id===orderId);
 const machine=machines().find(x=>x.id===v("ppMachine"));
 if(!order||!machine)return;
 const existing=planForOrder(orderId);
 const owner=printOrderOwner(order);
 const inspectionType=v("ppInspection");
 const now=new Date().toLocaleString("ko-KR");
 const planDate=v("ppDate")||currentPrintPlanDate();
 const data={
  orderId,product:order.product,customer:order.customer||"",machineId:machine.id,machineName:machine.name,
  planDate,priority:v("ppPriority"),qty:Number(v("ppQty"))||0,netQty:Number(v("ppNetQty"))||0,
  productType:v("ppProductType"),inspectionType,inspectionOwner:inspectionLabel(inspectionType)?owner.label:"",
  inspectionOwnerId:inspectionLabel(inspectionType)?owner.id:"",postProcessSummary:printPostProcessSummary(order),
  note:v("ppNote"),status:"계획",updatedAt:now,updatedBy:currentUserName()
 };
 const beforeOrderId=v("ppInsertBefore");
 if(existing){
  const from=existing.machineName;
  const oldSort=existing.sortOrder;
  const oldMachineId=existing.machineId;
  const oldPlanDate=existing.planDate;
  Object.assign(existing,data);
  if(beforeOrderId) insertPlanBefore(existing,machine.id,planDate,beforeOrderId);
  else if(oldMachineId!==machine.id || oldPlanDate!==planDate) appendPlanToLane(existing,machine.id,planDate);
  else existing.sortOrder=oldSort||existing.sortOrder||10;

function orderRegistrationTime(order, plan){
 const raw=order?.date||order?.createdAt||plan?.createdAt||"";
 const match=String(raw).match(/(\d{4})[.\-/]\s*(\d{1,2})[.\-/]\s*(\d{1,2})/);
 if(match)return new Date(Number(match[1]),Number(match[2])-1,Number(match[3])).getTime();
 const parsed=Date.parse(raw);
 return Number.isNaN(parsed)?Number.MAX_SAFE_INTEGER:parsed;
}

function parseYMD(dateStr){
 if(!dateStr) return null;
 const m=String(dateStr).match(/(\d{4})-(\d{2})-(\d{2})/);
 if(!m) return null;
 return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
}
function printWeekRange(dateStr){
 const d=parseYMD(dateStr)||new Date();
 const day=d.getDay();
 const mondayOffset = day===0 ? -6 : 1-day;
 const start=new Date(d); start.setDate(d.getDate()+mondayOffset);
 const end=new Date(start); end.setDate(start.getDate()+4);
 return {start,end};
}
function fmtWeekDate(d){
 return `${String(d.getFullYear()).slice(2)}년${String(d.getMonth()+1).padStart(2,"0")}월${String(d.getDate()).padStart(2,"0")}일`;
}
function fmtDueShort(dateStr){
 const d=parseYMD(dateStr);
 if(!d) return "납기미정";
 return `${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}납품`;
}
function isDateInRange(dateStr,start,end){
 const d=parseYMD(dateStr);
 if(!d) return false;
 return d.getTime()>=start.getTime() && d.getTime()<=end.getTime();
}

 detailParts.push(plan.postProcessSummary||printPostProcessSummary(order));
 detailParts.push(`정미:${fmt(plan.netQty||0)}매`);
 return `${plan.product} - ${fmt(plan.qty||0)}매[${fmtDueShort(order.due)}]`;
}
function planPrintSub(plan){

function assignmentForMachine(machineId){return machineAssignments().find(x=>x.machineId===machineId&&x.status==="진행중");}
function machineRoleOptions(){
 return db.employees.map(e=>`<option value="${e.name}">${e.name} · ${e.dept} · ${e.role}</option>`).join("");
}
function editMachineCrew(machineId){
 const m=machines().find(x=>x.id===machineId); if(!m)return;
 const crew=(db.machineCrews||{})[machineId]||{};
 openModal(`${m.name} 편성`, `<form class="form" onsubmit="saveMachineCrew('${machineId}');return false">
 <div class="field"><label>호기</label><input value="${m.name}" readonly></div><div class="field"><label>담당 공정</label><input value="${m.process}" readonly></div>
 <div class="field"><label>기장 선택</label><select id="crewCaptain"><option value="">선택</option>${machineRoleOptions()}</select></div>
 <div class="field wide"><label>파트너(조수) 선택</label><select id="crewPartners" multiple size="5">${machineRoleOptions()}</select><div class="footer-note">Ctrl / Shift로 여러 명을 선택하세요.</div></div>
 <div class="role-note wide">근무 시작과 종료 시간은 호기 화면의 버튼으로 실제 시각이 자동 기록됩니다.</div>
 <div class="form-actions"><button class="btn primary" type="submit">호기 편성 저장</button></div></form>`);
 document.getElementById("crewCaptain").value=crew.captain||"";
 [...document.getElementById("crewPartners").options].forEach(o=>o.selected=(crew.partners||[]).includes(o.value));
}
function saveMachineCrew(machineId){
 const crew=db.machineCrews=db.machineCrews||{};
 const old=crew[machineId]||{};
 const partners=[...document.getElementById("crewPartners").selectedOptions].map(o=>o.value);
 crew[machineId]={captain:document.getElementById("crewCaptain").value,partners,shiftStart:old.shiftStart||"",shiftEnd:old.shiftEnd||"",updatedBy:currentUserName(),updatedAt:new Date().toLocaleString("ko-KR")};
 saveDB(db);closeModal();render();
}
function registerMachineShift(machineId, type){
 const crew=(db.machineCrews||{})[machineId];
 const m=machines().find(x=>x.id===machineId);
 if(!crew?.captain){alert("먼저 기장과 파트너를 편성하세요.");return;}
 const now=new Date().toLocaleString("ko-KR");
 if(type==="start"){
   if(crew.shiftStart && !crew.shiftEnd){alert("이미 작업 시작이 등록되어 있습니다.");return;}
   crew.shiftStart=now;
   crew.shiftEnd="";
   alert(`${m.name} 작업 시작이 등록되었습니다.\n${now}`);
 }else{
   if(!crew.shiftStart){alert("작업 시작 버튼을 먼저 눌러주세요.");return;}
   if(crew.shiftEnd){alert("이미 작업 종료가 등록되어 있습니다.");return;}
   crew.shiftEnd=now;
   alert(`${m.name} 작업 종료가 등록되었습니다.\n${now}`);
 }
 crew.updatedBy=currentUserName();
 crew.updatedAt=now;
 db.auditLog=db.auditLog||[];
 db.auditLog.unshift({action:type==="start"?"호기 작업시작":"호기 작업종료",menu:"호기 작업배정",item:m.name,by:currentUserName(),at:now});
 saveDB(db);render();
}
function assignQueuedWork(machineId,orderIndex,stepIndex){
 const m=machines().find(x=>x.id===machineId), order=db.orders[orderIndex], flow=ensureWorkflow(order), step=flow[stepIndex];
 if(!m||!step)return;
 if(!compatible(m,step.process)){alert(`${m.name}는 ${step.process} 공정을 수행할 수 없습니다.`);return;}
 if(assignmentForMachine(machineId)){alert("선택한 호기에 진행 중인 작업이 있습니다.");return;}
 const crew=(db.machineCrews||{})[machineId];
 if(!crew?.captain){alert("먼저 호기에서 기장과 파트너를 편성하세요.");return;}
 if(!canManageProcess(step.process)){alert(`${step.process} 공정 부서장 또는 관리자만 작업을 편성할 수 있습니다.`);return;}
 const now=new Date().toLocaleString("ko-KR");
 machineAssignments().push(auditNew({id:"MA-"+Date.now().toString().slice(-7),orderId:order.id,product:order.product,process:step.process,machineId,machineName:m.name,captainName:crew.captain,partners:crew.partners||[],shiftStart:crew.shiftStart||"",shiftEnd:crew.shiftEnd||"",inputQty:Number(step.inputQty)||0,status:"진행중",startedAt:now}));
 step.stage="진행";step.startedBy=currentUserName();step.startedAt=now;
 auditUpdate(order,order);saveDB(db);render();
}
function completeMachineAssignment(assignIndex){
 const a=machineAssignments()[assignIndex];if(!a)return;
 if(!canManageProcess(a.process)){alert(`${a.process} 공정 부서장 또는 관리자만 완료할 수 있습니다.`);return;}
 openModal(`${a.machineName} · 작업 완료`, `<form class="form" onsubmit="saveMachineComplete(${assignIndex});return false">
 <div class="field"><label>오더</label><input value="${a.orderId}" readonly></div><div class="field"><label>공정</label><input value="${a.process}" readonly></div>
 <div class="field"><label>투입 수량</label><input value="${fmt(a.inputQty)}" readonly></div><div class="field"><label>완료 수량</label><input id="machineCompletedQty" type="number" min="1" value="${a.inputQty}" required></div>
 <div class="field wide"><label>완료 메모</label><textarea id="machineCompleteMemo"></textarea></div><div class="form-actions"><button class="btn green" type="submit">완료 및 다음 공정 인계</button></div></form>`);
}
function saveMachineComplete(assignIndex){
 const a=machineAssignments()[assignIndex], qty=Number(v("machineCompletedQty"))||0;
 if(!qty){alert("완료 수량을 입력하세요.");return;}
 const order=db.orders.find(o=>o.id===a.orderId), flow=ensureWorkflow(order), i=flow.findIndex(s=>s.process===a.process&&s.stage!=="완료");
 if(!order||i<0){alert("현재 공정을 찾을 수 없습니다.");return;}
 const step=flow[i],now=new Date().toLocaleString("ko-KR");a.status="완료";a.completedQty=qty;a.completedAt=now;a.completeMemo=v("machineCompleteMemo");
 step.stage="완료";step.completedQty=qty;step.completedBy=currentUserName();step.completedAt=now;step.note=a.completeMemo;
 const next=flow[i+1];
 auditUpdate(order,order);
 saveDB(db);
 closeModal();
 if(next){
   next.stage="준비";
   next.inputQty=qty;
   saveDB(db);
   render();
 }else{
   // 포장 완료는 재고관리 입고로 처리하며 작업지시/배정/추적에서는 제외됩니다.
   openWarehouseReceive(order,qty,"machine");
 }
}


function releaseMachineAssignment(assignIndex){
 const assignments=machineAssignments();
 const a=assignments[assignIndex];
 if(!a)return;
 if(!confirm(`${a.machineName}에 편성된 ${a.orderId} 작업을 대기풀로 되돌릴까요?\n완료수량이 없는 작업만 되돌릴 수 있습니다.`))return;
 const order=db.orders.find(o=>o.id===a.orderId);
 if(!order){alert("연결된 수주오더를 찾을 수 없습니다.");return;}
 const flow=ensureWorkflow(order);
 const stepIndex=flow.findIndex(s=>s.process===a.process && s.stage!=="완료");
 if(stepIndex<0 || (Number(a.completedQty)||0)>0){
   alert("완료수량이 기록된 작업은 대기풀로 되돌릴 수 없습니다.");
   return;
 }
 const now=new Date().toLocaleString("ko-KR");
 flow[stepIndex].stage="준비";
 flow[stepIndex].startedBy="";
 flow[stepIndex].startedAt="";
 a.status="작업취소";
 a.cancelledAt=now;
 a.cancelledBy=currentUserName();
 a.cancelReason="오배정 대기풀 복귀";
 auditUpdate(order,order);
 db.auditLog=db.auditLog||[];
 db.auditLog.unshift({action:"작업오배정취소",menu:"작업배정",item:`${a.orderId} / ${a.process} / ${a.machineName}`,by:currentUserName(),at:now});
 saveDB(db);
 closeModal();
 render();
}
function moveMachineAssignment(assignIndex){
 const a=machineAssignments()[assignIndex];
 if(!a)return;
 const order=db.orders.find(o=>o.id===a.orderId);
 const flow=order?ensureWorkflow(order):[];
 const step=flow.find(s=>s.process===a.process && s.stage!=="완료");
 if(!order||!step){alert("이동할 현재 공정을 찾을 수 없습니다.");return;}
 const options=machines().filter(m=>compatible(m,a.process)&&m.id!==a.machineId&&!assignmentForMachine(m.id));
 if(!options.length){alert("이동 가능한 빈 호기가 없습니다.");return;}
 openModal(`${a.orderId} 작업 호기 변경`, `<form class="form" onsubmit="saveMoveMachineAssignment(${assignIndex});return false">
  <div class="field"><label>현재 호기</label><input value="${a.machineName}" readonly></div>
  <div class="field"><label>공정</label><input value="${a.process}" readonly></div>
  <div class="field wide"><label>이동할 빈 호기</label><select id="moveMachine">${options.map(m=>`<option value="${m.id}">${m.name}</option>`).join("")}</select></div>
  <div class="field wide"><label>변경 사유</label><textarea id="moveReason" placeholder="예: 잘못 선택, 설비 점검, 우선순위 변경"></textarea></div>
  <div class="form-actions"><button class="btn primary" type="submit">호기 변경</button></div>
 </form>`);
}
function saveMoveMachineAssignment(assignIndex){
 const a=machineAssignments()[assignIndex];
 const m=machines().find(x=>x.id===v("moveMachine"));
 if(!a||!m)return;
 if(assignmentForMachine(m.id)){alert("선택한 호기에 진행 중인 작업이 있습니다.");return;}
 const now=new Date().toLocaleString("ko-KR");
 const oldMachine=a.machineName;
 a.machineId=m.id;
 a.machineName=m.name;
 a.movedAt=now;
 a.movedBy=currentUserName();
 a.moveReason=v("moveReason");
 const crew=(db.machineCrews||{})[m.id]||{};
 if(crew.captain){
   a.captainName=crew.captain;
   a.partners=crew.partners||[];
   a.shiftStart=crew.shiftStart||"";
   a.shiftEnd=crew.shiftEnd||"";
 }
 db.auditLog=db.auditLog||[];
 db.auditLog.unshift({action:"작업호기변경",menu:"작업배정",item:`${a.orderId} / ${a.process} / ${oldMachine} → ${m.name}`,by:currentUserName(),at:now});
 saveDB(db);
 closeModal();
 render();
}

function activeMachineForCurrentUser(){
  const user=currentUserName();
  const crewMap=db.machineCrews||{};
  const machine=machines().find(m=>{
    const crew=crewMap[m.id]||{};
    return crew.captain===user || crew.captain===((currentUser()||{}).name||"");
  });
  return machine||null;
}
function currentCrewForMachine(machineId){return (db.machineCrews||{})[machineId]||{};}
function currentAssignmentForMachine(machineId){return assignmentForMachine(machineId);}
function queueForMachine(machine){
  if(!machine)return [];
  return queueItems().filter(x=>compatible(machine,x.step.process));
}
function assignFromWorkTab(machineId,orderIndex,stepIndex){
  assignQueuedWork(machineId,orderIndex,stepIndex);
}

function traceStepClass(step, index, flow){
  if(step.stage==="완료") return "done";
  const first=flow.findIndex(x=>x.stage!=="완료");
  return index===first?"active":"wait";
}
function trace(){
  const products=[...new Set(db.orders.filter(o=>o.status!=="입고완료" && o.status!=="납품완료").map(o=>o.product))];
  const selected=(window.traceProductName&&products.includes(window.traceProductName))?window.traceProductName:(products[0]||"");
  window.traceProductName=selected;
  const orders=db.orders.filter(o=>o.product===selected && o.status!=="입고완료" && o.status!=="납품완료");
  document.getElementById("trace").innerHTML=`<div class="stack">
   <div class="card">
    <h3 class="section-title">제품 공정추적</h3>

function receiveFinishedGoods(orderId, qty, source){
  const order=db.orders.find(o=>o.id===orderId);
  if(!order){alert("수주오더를 찾을 수 없습니다.");return;}
  const destination=(document.querySelector('input[name="warehouse"]:checked')||{}).value;
  if(!destination){alert("처리 방법을 선택하세요.");return;}
  const note=document.getElementById("warehouseNote").value||"";
  const now=new Date().toLocaleString("ko-KR");

  if(destination==="즉시 납품"){
    db.shipping=db.shipping||[];
    db.shipping.push(auditNew({
      date:new Date().toISOString().slice(0,10),
      customer:order.customer||"",
      order:order.id,
      product:order.product,
      qty:Number(qty),
      vehicle:"",
      status:"납품완료",
      note:`포장완료 즉시 납품${note?` / ${note}`:""}`
    }));
    order.status="납품완료";
    order.deliveryType="즉시 납품";
    order.finishedQty=Number(qty);
    order.finishedAt=now;
    order.finishedBy=currentUserName();
    order.finishedWarehouse="";
    auditUpdate(order,order);
    db.auditLog=db.auditLog||[];
    db.auditLog.unshift({action:"포장완료즉시납품",menu:"출고 / 납품",item:`${orderId} / ${qty}EA`,by:currentUserName(),at:now});
    saveDB(db);
    closeModal();
    render();
    return;
  }

  db.inventory=db.inventory||[];
  const existing=db.inventory.find(x=>x.type==="완제품" && x.name===order.product && x.location===destination);
  if(existing){
    existing.stock=(Number(existing.stock)||0)+Number(qty);
    existing.updatedBy=currentUserName();
    existing.updatedAt=now;
    existing.note=(existing.note?existing.note+" / ":"")+`${orderId} 입고 ${qty}EA ${note}`.trim();
  }else{
    db.inventory.push(auditNew({
      type:"완제품",
      name:order.product,
      spec:(db.products.find(p=>p.name===order.product)||{}).size||"완제품",
      stock:Number(qty),
      unit:"EA",
      min:0,
      location:destination,
      note:`${orderId} 포장완료 입고 ${note}`.trim()
    }));
  }
  order.status="입고완료";
  order.finishedWarehouse=destination;
  order.finishedQty=Number(qty);
  order.finishedAt=now;
  order.finishedBy=currentUserName();
  auditUpdate(order,order);
  db.auditLog=db.auditLog||[];
  db.auditLog.unshift({action:"포장완료입고",menu:"재고관리",item:`${orderId} / ${destination} / ${qty}EA`,by:currentUserName(),at:now});
  saveDB(db);
  closeModal();
  render();
}

function processDepartment(process){
 const map={인쇄:"인쇄팀",코팅:"후가공팀",금박:"후가공팀",형압:"후가공팀",합지:"합지팀",톰슨:"톰슨팀",접착:"접착·포장팀",포장:"접착·포장팀"};
 return map[process]||"생산관리";
}
function dateOnly(value){
 if(!value)return "";
 const m=String(value).match(/(\d{4})[.\-]\s?(\d{1,2})[.\-]\s?(\d{1,2})/);
 if(m)return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
 return String(value).slice(0,10);
}
function productionMachineFor(orderId,process){
 const found=(db.machineAssignments||[]).slice().reverse().find(a=>a.orderId===orderId&&a.process===process&&a.status==="완료");
 return found?{name:found.machineName||"-",captain:found.captainName||found.completedBy||"-",startedAt:found.startedAt||"",completedAt:found.completedAt||""}:null;
}
function productionRowsDetailed(){
 const rows=[];
 db.orders.filter(o=>o.status!=="입고완료"&&o.status!=="납품완료").forEach(o=>{
  ensureWorkflow(o).forEach(s=>{
   const machine=productionMachineFor(o.id,s.process);
   rows.push({
    date:dateOnly(s.completedAt||machine?.completedAt||s.startedAt||o.date),
    order:o, step:s, process:s.process, department:processDepartment(s.process),
    machine:machine?.name||"-", captain:machine?.captain||s.completedBy||"-",
    startedAt:machine?.startedAt||s.startedAt||"-", completedAt:s.completedAt||machine?.completedAt||"-",
    inputQty:Number(s.inputQty||0), completedQty:Number(s.completedQty||0),
    status:s.stage, memo:s.note||""
   });
  });
 });
 (db.production||[]).forEach(p=>{
  const has=rows.some(r=>r.order.id===p.order&&r.process===p.process&&r.completedQty===Number(p.good||0));
  if(!has){
   const machine=productionMachineFor(p.order,p.process);
   rows.push({date:dateOnly(p.updated||p.createdAt),order:{id:p.order,product:p.product||"-",customer:"-"},step:{},process:p.process,department:processDepartment(p.process),machine:machine?.name||"-",captain:machine?.captain||"-",startedAt:machine?.startedAt||"-",completedAt:p.updated||"-",inputQty:Number(p.good||0)+Number(p.bad||0),completedQty:Number(p.good||0),badQty:Number(p.bad||0),status:Number(p.progress)>=100?"완료":"진행",memo:p.note||""});
  }
 });
 return rows;
}
function setProductionFilter(key,value){window.productionFilters=window.productionFilters||{};window.productionFilters[key]=value;render();}

   <div class="field"><label>설비</label><select onchange="setProductionFilter('machine',this.value)"><option>전체</option>${machinesList.map(m=>`<option ${selectedMachine===m?"selected":""}>${m}</option>`).join("")}</select></div>
   <div class="field"><label>진행상태</label><select onchange="setProductionFilter('status',this.value)"><option>전체</option><option ${selectedStatus==="준비"?"selected":""}>준비</option><option ${selectedStatus==="진행"?"selected":""}>진행</option><option ${selectedStatus==="완료"?"selected":""}>완료</option><option ${selectedStatus==="대기"?"selected":""}>대기</option></select></div>
  </div></div>

  </div>
  <div class="card"><h3 class="section-title">설비별 현재 작업</h3>${table(["부서","호기","공정","기장 / 파트너","현재 작업","투입수량","시작시각","상태"],machines().map(m=>{const c=(db.machineCrews||{})[m.id]||{},a=assignmentForMachine(m.id);return `<tr><td>${processDepartment(m.process==="금박 / 형압"?"금박":m.process)}</td><td><b>${m.name}</b></td><td>${m.process}</td><td>${c.captain||"-"}${(c.partners||[]).length?` / ${(c.partners||[]).join(", ")}`:""}</td><td>${a?`${a.orderId} · ${a.product}`:"-"}</td><td>${a?fmt(a.inputQty||0):"-"}</td><td>${a?(a.startedAt||"-"):"-"}</td><td>${a?statusBadge("진행중"):'<span class="badge ok">대기</span>'}</td></tr>`}).join(""))}</div>

  <div class="card"><div class="actions"><button class="btn primary" onclick="openProduction()">+ 생산실적 입력</button></div><br>${table(["작업일자","부서","설비","오더","제품","공정","양품","불량","진행률","최종 갱신","관리"],db.production.map((x,i)=>`<tr><td>${dateOnly(x.updated||x.createdAt)||"-"}</td><td>${processDepartment(x.process)}</td><td>${x.machine||productionMachineFor(x.order,x.process)?.name||"-"}</td><td>${x.order}</td><td>${x.product}</td><td>${statusBadge(x.process)}</td><td>${fmt(x.good)} EA</td><td>${fmt(x.bad)} EA</td><td>${x.progress}%</td><td>${x.updated}</td><td><button class="btn small danger" onclick="del('production',${i})">삭제</button></td></tr>`).join(""))}</div>
 </div>`;
}

function canViewAllSales(){
 const role=currentUser()?.role||"";
 return ["관리자","대표","경영관리자"].includes(role);
}
function salesOwnerId(row){
 if(row.ownerId) return row.ownerId;
 const linked=(db.orders||[]).find(o=>o.id===row.order);
 return linked?.ownerId||"";
}
function isMySalesRow(row){
 if(canViewAllSales()) return true;
 const u=currentUser();
 if(!u) return false;
 const ownerId=salesOwnerId(row);
 if(ownerId) return ownerId===u.id;
 return (row.createdBy||"")===currentUserName();
}
function isMyOrder(order){
 if(canViewAllSales()) return true;
 const u=currentUser();
 if(!u) return false;
 if(order.ownerId) return order.ownerId===u.id;
 return (order.createdBy||"")===currentUserName();
}
function salesOwnerName(row){
 const linked=(db.orders||[]).find(o=>o.id===row.order);
 return row.ownerName||linked?.ownerName||row.createdBy||"-";
}

function sales(){
 const visible=(db.sales||[]).filter(isMySalesRow);

 const showAll=canViewAllSales();
 document.getElementById("sales").innerHTML=`<div class="stack">

  <div class="actions"><button class="btn primary" onclick="openSales()">+ 매출 등록</button></div>
  <div class="card">${table([...(showAll?["담당자"]:[]),"월","거래처","오더","제품","수량","매출액","수금액","미수금","상태","관리"],visible.map(x=>`<tr>${showAll?`<td>${salesOwnerName(x)}</td>`:""}<td>${x.month}</td><td>${x.customer}</td><td>${x.order}</td><td>${x.product||'-'}</td><td>${x.qty?fmt(x.qty)+' EA':'-'}</td><td>${money(x.amount)}</td><td>${money(x.received)}</td><td>${money(x.receivable)}</td><td>${statusBadge(x.status)}</td><td><button class="btn small danger" onclick="del('sales',${db.sales.indexOf(x)})">삭제</button></td></tr>`))}</div>

function applyRolePreset(){
 const role=v("urole"), preset=ROLE_PRESETS[role];
 const allowed=preset?.menus==="ALL"?menus.filter(([id])=>id!=="users").map(x=>x[0]):(preset?.menus||[]);

 const captainProcesses=captainProcessesForRole(role);
 if(captainProcesses.length){
   document.querySelectorAll('input[name="leaderProcess"]').forEach(x=>{
     x.checked=captainProcesses.includes(x.value);
     x.disabled=!captainProcesses.includes(x.value);
   });
 }else{
   document.querySelectorAll('input[name="leaderProcess"]').forEach(x=>x.disabled=false);
 }
}

function monthKey(v){return (v||"").slice(0,7)||"미분류";}
function pct(n,d){return d?Math.round((n/d)*100):0;}
function salesAnalysis(){
 const all=canViewAllSales();
 const salesRows=analysisScopeSales();
 const orderRows=analysisScopeOrders();
 const total=salesRows.reduce((a,x)=>a+Number(x.amount||0),0);
 const received=salesRows.reduce((a,x)=>a+Number(x.received||0),0);
 const receivable=salesRows.reduce((a,x)=>a+Number(x.receivable||0),0);
 const collectionRate=pct(received,total);
 const byCustomer={};
 const byMonth={};
 const byOwner={};
 salesRows.forEach(x=>{
   const customer=x.customer||"미지정 거래처";
   byCustomer[customer]=byCustomer[customer]||{amount:0,received:0,receivable:0,count:0};
   byCustomer[customer].amount+=Number(x.amount||0);
   byCustomer[customer].received+=Number(x.received||0);
   byCustomer[customer].receivable+=Number(x.receivable||0);
   byCustomer[customer].count+=1;
   const month=monthKey(x.month);
   byMonth[month]=(byMonth[month]||0)+Number(x.amount||0);
   const owner=salesOwnerName(x)||"미지정";
   byOwner[owner]=(byOwner[owner]||0)+Number(x.amount||0);
 });
 const customers=Object.entries(byCustomer).sort((a,b)=>b[1].amount-a[1].amount);
 const months=Object.entries(byMonth).sort((a,b)=>a[0].localeCompare(b[0]));
 const owners=Object.entries(byOwner).sort((a,b)=>b[1]-a[1]);
 const topCustomer=customers[0];
 const biggestReceivable=customers.slice().sort((a,b)=>b[1].receivable-a[1].receivable)[0];
 const lastMonth=months[months.length-1];
 const prevMonth=months[months.length-2];
 const growth=lastMonth&&prevMonth&&prevMonth[1] ? Math.round(((lastMonth[1]-prevMonth[1])/prevMonth[1])*100) : null;
 const maxCustomer=Math.max(1,...customers.map(x=>x[1].amount));
 const maxMonth=Math.max(1,...months.map(x=>x[1]));
 const maxOwner=Math.max(1,...owners.map(x=>x[1]));
 const insights=[];
 if(total===0) insights.push({type:"warn",title:"매출 데이터 부족",text:"분석 가능한 매출 데이터가 아직 없습니다. 수주오더 또는 매출을 등록하면 거래처·수금·담당자 분석이 자동으로 생성됩니다."});
 else{
  if(receivable>0) insights.push({type:receivable/total>=0.3?"danger":"warn",title:"수금 리스크",text:`현재 미수금은 ${money(receivable)}으로, 등록 매출의 ${pct(receivable,total)}%입니다. ${biggestReceivable?`${biggestReceivable[0]} 거래처의 미수금 ${money(biggestReceivable[1].receivable)}을 우선 관리하세요.`:""}`});
  if(topCustomer && topCustomer[1].amount/total>=0.5) insights.push({type:"warn",title:"거래처 집중도",text:`${topCustomer[0]} 거래처 매출 비중이 ${pct(topCustomer[1].amount,total)}%입니다. 핵심 거래처 관리와 함께 신규 고객 다변화가 필요합니다.`});
  else if(topCustomer) insights.push({type:"",title:"핵심 거래처",text:`최대 매출 거래처는 ${topCustomer[0]}이며 매출 ${money(topCustomer[1].amount)}입니다. 재주문 주기와 수익성 검토 대상으로 관리하세요.`});
  if(growth!==null) insights.push({type:growth<0?"danger":"",title:"월별 매출 추세",text:`최근 월 매출은 전월 대비 ${growth>=0?"+":""}${growth}%입니다. ${growth<0?"감소 원인을 거래처·납기·수금 기준으로 점검하세요.":"상승 흐름이 유지되도록 핵심 거래처 후속 수주를 관리하세요."}`});
  const delayed=orderRows.filter(o=>o.status!=="입고완료"&&o.status!=="납품완료"&&o.due&&new Date(o.due)<new Date()).length;
  if(delayed) insights.push({type:"danger",title:"납기 리스크",text:`현재 납기 경과 생산 오더가 ${delayed}건입니다. 생산 일정 지연이 매출 인식 및 수금 지연으로 이어질 수 있어 우선 점검이 필요합니다.`});
 }
 document.getElementById("salesanalysis").innerHTML=`<div class="stack">
  <div class="card"><h3 class="section-title">${all?"회사 매출 전문가 분석":"내 수주오더 매출 분석"}</h3><div class="notice">${all?"대표·경영관리자 기준 전체 회사 매출, 거래처, 수금 및 영업 담당자 현황을 분석합니다.":"본인이 등록한 수주오더 및 매출만 기준으로 분석합니다."}</div></div>
  <div class="analysis-grid">
   <div class="analysis-card"><div class="label">등록 매출</div><div class="value">${money(total)}</div><div class="sub">분석 범위 기준</div></div>
   <div class="analysis-card"><div class="label">수금액</div><div class="value">${money(received)}</div><div class="sub">수금률 ${collectionRate}%</div></div>

   <div class="analysis-card"><div class="label">활성 거래처</div><div class="value">${customers.length}곳</div><div class="sub">등록 매출 기준</div></div>
  </div>
  <div class="analysis-layout">
   <div class="card"><h3 class="section-title">거래처별 매출 비중</h3><div class="bar-list">${customers.length?customers.slice(0,8).map(([name,d])=>`<div class="bar-row"><div>${name}</div><div class="bar-track"><div class="bar-fill" style="width:${pct(d.amount,maxCustomer)}%"></div></div><b>${money(d.amount)}</b></div>`).join(""):'<div class="empty">분석할 매출 데이터가 없습니다.</div>'}</div></div>
   <div class="card"><h3 class="section-title">전문가 진단</h3><div class="stack">${insights.map(x=>`<div class="analysis-insight ${x.type||""}"><b>${x.title}</b><br>${x.text}</div>`).join("")}</div></div>
  </div>
  <div class="analysis-layout">
   <div class="card"><h3 class="section-title">월별 매출 추이</h3><div class="bar-list">${months.length?months.map(([month,value])=>`<div class="bar-row"><div>${month}</div><div class="bar-track"><div class="bar-fill" style="width:${pct(value,maxMonth)}%"></div></div><b>${money(value)}</b></div>`).join(""):'<div class="empty">월별 매출 데이터가 없습니다.</div>'}</div></div>
   <div class="card"><h3 class="section-title">미수금 우선관리 거래처</h3>${table(["거래처","매출","미수금","수금률"],customers.slice().sort((a,b)=>b[1].receivable-a[1].receivable).slice(0,6).map(([name,d])=>`<tr><td><b>${name}</b></td><td>${money(d.amount)}</td><td>${money(d.receivable)}</td><td>${pct(d.received,d.amount)}%</td></tr>`))}</div>
  </div>
  ${all?`<div class="card"><h3 class="section-title">영업 담당자별 매출</h3><div class="bar-list">${owners.length?owners.map(([name,value])=>`<div class="bar-row"><div>${name}</div><div class="bar-track"><div class="bar-fill" style="width:${pct(value,maxOwner)}%"></div></div><b>${money(value)}</b></div>`).join(""):'<div class="empty">담당자별 데이터가 없습니다.</div>'}</div></div>`:""}
 </div>`;
}

function calcStock(){
 const input=document.getElementById("psheet");
 const out=document.getElementById("pstock");
 if(!input || !out) return;
 const raw=input.value.trim().replace(/[xX*]/g,"*").replace(/\s+/g,"");
 const m=raw.match(/^(\d+)\*(\d+)$/);
 if(!m){out.value="";return;}
 const width=Number(m[1]), height=Number(m[2]);
 if(width<=10 || height<=10){out.value="";return;}
 // 용지 975 * 650 → 원단 640 * 965
 out.value=`${height-10} * ${width-10} mm`;
}
function switchStockMode(){

 // 원단 종류는 자동계산 여부와 관계없이 항상 직접 선택합니다.
 if(autoSize) autoSize.disabled=!auto;

}
function validateStock5(){

 if(!raw){alert("직접 입력 원단 규격을 입력하세요.");return false}
 const m=raw.match(/^(\d+)\s*\*\s*(\d+)$/);
 if(!m){alert("원단 규격은 예: 640 * 965 형식으로 입력하세요.");return false}
 if(Number(m[1])%5||Number(m[2])%5){alert("원단 규격은 반드시 5mm 단위로 입력해야 합니다.");return false}

function findProductByName(name){

}
function updateOrderPaperCalc(){
 const product=findProductByName(document.getElementById("oproduct").value);
 const qty=Number(document.getElementById("oqty").value)||0;
 const extra=Number(document.getElementById("oextra").value)||0;
 const jeol=Number(product?.jeol)||0;
 const base=jeol>0?Math.ceil(qty/jeol):0;
 const total=base+extra;
 const salesAmount=(Number(product?.unit)||0)*qty;
 const jeolInfo=document.getElementById("ojeolInfo");
 const sheetInfo=document.getElementById("osheetQty");
 const salesInfo=document.getElementById("osalesAmount");
 const paperInfo=document.getElementById("opaperCalcInfo");

 if(product){
   document.getElementById("oproductCode").value=product.id||"";
   document.getElementById("ocustomer").value=product.customer||"";
   document.getElementById("ounit").value=product.unit?Number(product.unit).toLocaleString("ko-KR")+"원":"0원";
   if(jeolInfo) jeolInfo.value=jeol?`${jeol}절`:"미입력";
 }else{
   document.getElementById("oproductCode").value="";
   document.getElementById("ocustomer").value="";
   document.getElementById("ounit").value="";
   if(jeolInfo) jeolInfo.value="";
 }
 if(sheetInfo) sheetInfo.value=(product&&total)?`${total.toLocaleString()}매`:"";
 if(salesInfo) salesInfo.value=product?`${salesAmount.toLocaleString("ko-KR")}원`:"";
 if(paperInfo){
   if(!document.getElementById("oproduct").value.trim()) paperInfo.textContent="제품명을 검색해 제품사양서를 불러오세요.";
   else if(!product) paperInfo.textContent="일치하는 제품사양서가 없습니다. 제품사양서에 먼저 등록해 주세요.";
   else if(!jeol) paperInfo.textContent="제품사양서에 절 수가 입력되지 않았습니다.";
   else paperInfo.textContent=`계산: 수량 ${qty.toLocaleString()} EA ÷ ${jeol}절 = ${base.toLocaleString()}매 + 여유 ${extra.toLocaleString()}매 = ${total.toLocaleString()}매`;
 }
}

function saveOrder(){
 const product=findProductByName(v("oproduct"));
 const qty=+v("oqty")||0;
 const extra=+v("oextra")||0;
 const jeol=Number(product?.jeol)||0;
 if(!product){alert("제품사양서에서 제품을 검색해 선택하세요.");return;}
 if(!jeol){alert("선택한 제품의 절 수가 제품사양서에 입력되어 있지 않습니다.");return;}
 const sheetBase=Math.ceil(qty/jeol);
 const sheetQty=sheetBase+extra;
 const orderId="SO-"+Date.now().toString().slice(-6);
 const unit=+product.unit||0;
 const amount=unit*qty;
 const u=currentUser();
 const newOrder=auditNew({
  id:orderId,
  ownerId:u?.id||"",
  ownerName:u?`${u.name} (${u.dept})`:"",
  date:v("odate"),
  customer:product.customer||"",
  product:product.name,
  productCode:product.id,
  unit,
  amount,
  qty,jeol,extra,sheetBase,sheetQty,
  due:v("odue"),status:"작업지시",note:v("onote")
 });
 newOrder.workflow=productWorkflow(product.name).map((process,i)=>({
   process,
   stage:i===0?"준비":"대기",
   inputQty:i===0?sheetQty:0,
   completedQty:0,
   completedBy:"",
   completedAt:"",
   note:""
 }));
 db.orders.push(newOrder);
 // 수주오더 등록과 동시에 매출관리 표에 예상 매출을 자동 등록합니다.
 db.sales=db.sales||[];
 const exists=db.sales.some(x=>x.order===orderId);
 if(!exists){
   db.sales.push(auditNew({
     month:(v("odate")||new Date().toISOString().slice(0,10)).slice(0,7),
     customer:product.customer||"",
     order:orderId,
     product:product.name,
     unit,
     qty,
     amount,
     received:0,
     receivable:amount,
     status:"미수",
     ownerId:newOrder.ownerId,
     ownerName:newOrder.ownerName
   }));
 }
 saveDB(db);closeModal();render();
}

function saveProduction(){db.production.push(auditNew({date:v("prodate"),order:v("proorder"),product:v("proproduct"),process:v("proprocess"),machine:v("promachine")==="미지정"?"":v("promachine"),good:+v("progood")||0,bad:+v("probad")||0,progress:Math.min(100,+v("proprogress")||0),note:v("pronote"),updated:new Date().toLocaleString("ko-KR")}));saveDB(db);closeModal();render()}
function openShipping(){openModal("출고 / 납품 등록",addForm([{id:"sdate",label:"출고일",type:"date",value:new Date().toISOString().slice(0,10)},{id:"scustomer",label:"거래처",required:true},{id:"sorder",label:"오더번호",type:"select",options:db.orders.map(x=>x.id)},{id:"sproduct",label:"제품명",type:"select",options:db.products.map(x=>x.name)},{id:"sqty",label:"출고수량",type:"number"},{id:"svehicle",label:"차량 / 운송정보"},{id:"sstatus",label:"상태",type:"select",options:["출고완료","납품완료"]},{id:"snote",label:"비고",type:"textarea",wide:true}],"등록","saveShipping()"))}
function saveShipping(){db.shipping.push(auditNew({date:v("sdate"),customer:v("scustomer"),order:v("sorder"),product:v("sproduct"),qty:+v("sqty")||0,vehicle:v("svehicle"),status:v("sstatus"),note:v("snote")}));saveDB(db);closeModal();render()}
function openInventory(mode="material"){
 const isFinished=mode==="finished";
 openModal(isFinished?"완제품 재고 등록":"원지 / 원단 / 부자재 등록", addForm([
  {id:"itype",label:"구분",type:"select",options:isFinished?["완제품"]:["원지","원단","부자재"]},
  {id:"iname",label:"품목명",required:true},
  {id:"ispec",label:"규격"},
  {id:"istock",label:"현재고",type:"number"},
  {id:"iunit",label:"단위",placeholder:isFinished?"EA":"매 / 롤 / EA"},
  {id:"imin",label:"최소재고",type:"number"},
  {id:"iloc",label:"보관위치",type:"select",options:isFinished?warehouses():["원지창고","부자재창고","후가공창고","기타"]},
  {id:"inote",label:"비고",type:"textarea",wide:true}
 ],"등록","saveInventory()"))
}
function saveInventory(){db.inventory.push(auditNew({type:v("itype"),name:v("iname"),spec:v("ispec"),stock:+v("istock")||0,unit:v("iunit"),min:+v("imin")||0,location:v("iloc"),note:v("inote")}));saveDB(db);closeModal();render()}
function openSales(){openModal("매출 등록",addForm([{id:"smonth",label:"매출월",type:"month",value:"2026-06"},{id:"salcustomer",label:"거래처",required:true},{id:"salorder",label:"오더번호"},{id:"salamount",label:"매출액",type:"number"},{id:"salreceived",label:"수금액",type:"number"}],"등록","saveSales()"))}
function saveSales(){let amount=+v("salamount")||0, received=+v("salreceived")||0, receivable=amount-received;const u=currentUser();db.sales.push(auditNew({month:v("smonth"),customer:v("salcustomer"),order:v("salorder"),amount,received,receivable,status:receivable<=0?"수금완료":received>0?"부분수금":"미수",ownerId:u?.id||"",ownerName:u?`${u.name} (${u.dept})`:""}));saveDB(db);closeModal();render()}
function openEmployee(index=null){
 const e=index!==null?db.employees[index]:{};
 const skillOptions=["인쇄","코팅","금박","형압","합지","톰슨","접착","포장","영업","품질","출고 / 납품","관리"];
 openModal(index!==null?"사원 정보 수정":"사원 등록", `<form class="form" onsubmit="saveEmployee(${index===null?"null":index});return false">
  <div class="field"><label>사번</label><input id="ecode" value="${e.code||`SE-${String(db.employees.length+1).padStart(3,"0")}`}" required></div>
  <div class="field"><label>성명</label><input id="ename" value="${e.name||""}" required></div>
  <div class="field"><label>부서</label><select id="edept">${["생산1팀","생산2팀","후가공팀","품질관리팀","영업팀","관리팀","물류팀","기타"].map(x=>`<option ${e.dept===x?"selected":""}>${x}</option>`).join("")}</select></div>
  <div class="field"><label>직책 / 담당</label><input id="erole" value="${e.role||""}" placeholder="예: 인쇄 기장, 생산 반장"></div>
  <div class="field"><label>연락처</label><input id="ephone" value="${e.phone||""}" placeholder="010-0000-0000"></div>
  <div class="field"><label>입사일</label><input id="ejoinDate" type="date" value="${e.joinDate||""}"></div>
  <div class="field"><label>고용형태</label><select id="eemploymentType">${["정규직","계약직","일용직","외주","기타"].map(x=>`<option ${e.employmentType===x?"selected":""}>${x}</option>`).join("")}</select></div>
  <div class="field"><label>근무조</label><select id="eshift">${["주간","야간","2교대","3교대","상시","미정"].map(x=>`<option ${e.shift===x?"selected":""}>${x}</option>`).join("")}</select></div>
  <div class="field"><label>재직상태</label><select id="estatus">${["재직","휴직","퇴사"].map(x=>`<option ${(e.status||"재직")===x?"selected":""}>${x}</option>`).join("")}</select></div>
  <div class="field wide"><label>담당 가능 공정</label><div class="warehouse-choice">${skillOptions.map(s=>`<label class="warehouse-option"><input type="checkbox" name="employeeSkill" value="${s}" ${(e.skills||[]).includes(s)?"checked":""}>${s}</label>`).join("")}</div></div>
  <div class="field wide"><label>비고</label><textarea id="enote" placeholder="자격증, 근무 유의사항, 기타 메모">${e.note||""}</textarea></div>
  <div class="form-actions"><button class="btn primary" type="submit">${index!==null?"수정 저장":"사원 등록"}</button></div>
 </form>`);
}
function saveEmployee(index=null){
 const skills=[...document.querySelectorAll('input[name="employeeSkill"]:checked')].map(x=>x.value);
 const data={code:v("ecode"),name:v("ename"),dept:v("edept"),role:v("erole"),phone:v("ephone"),joinDate:v("ejoinDate"),employmentType:v("eemploymentType"),shift:v("eshift"),status:v("estatus"),skills,note:v("enote")};
 const duplicated=db.employees.some((x,i)=>x.code===data.code && i!==index);
 if(duplicated){alert("이미 사용 중인 사번입니다.");return;}
 if(index===null) db.employees.push(auditNew(data));
 else {Object.assign(db.employees[index],data);auditUpdate(db.employees[index],db.employees[index]);}
 saveDB(db);closeModal();render();
}
function closeMonth(){
 const month=new Date().toISOString().slice(0,7);
 const all=canViewAllSales();
 const scopeOrders=(db.orders||[]).filter(isMyOrder);
 const scopeOrderIds=new Set(scopeOrders.map(o=>o.id));
 const scopedSales=(db.sales||[]).filter(x=>x.month===month && isMySalesRow(x));
 const sales=scopedSales.reduce((a,x)=>a+Number(x.amount||0),0);
 const rec=scopedSales.reduce((a,x)=>a+Number(x.receivable||0),0);
 const prod=(db.production||[]).filter(x=>all || scopeOrderIds.has(x.order)).reduce((a,x)=>a+Number(x.good||0),0);
 const ship=(db.shipping||[]).filter(x=>all || scopeOrderIds.has(x.order)).reduce((a,x)=>a+Number(x.qty||0),0);
 const u=currentUser();
 db.closing.unshift(auditNew({month,sales,production:prod,shipping:ship,receivable:rec,status:"검토중",ownerId:all?"ALL":u?.id||"",ownerName:all?"전체 영업사원":(u?`${u.name} (${u.dept})`:"")}));
 saveDB(db);render();alert(all?"전체 영업 월마감 검토 자료가 생성되었습니다.":"내 수주오더 기준 월마감 검토 자료가 생성되었습니다.");
}
function del(key,i){
 if(isReadOnly()){alert("조회전용 계정은 데이터를 변경할 수 없습니다.");return;}
 if(confirm("이 데이터를 삭제할까요?")){const removed=db[key][i];db.auditLog=db.auditLog||[];db.auditLog.unshift({action:"삭제",menu:key,item:removed.id||removed.name||removed.product||"-",by:currentUserName(),at:new Date().toLocaleString("ko-KR")});db[key].splice(i,1);saveDB(db);render()}
}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="printflow_erp_backup.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);saveDB(db);render();alert("데이터를 불러왔습니다.")}catch{alert("올바른 백업 파일이 아닙니다.")}};r.readAsText(file)}
function resetDemo(){if(confirm("현재 입력한 데이터가 모두 초기화됩니다.")){db=demo();saveDB(db);render()}}
nav();updateUserChip();if(!ensureLogin()){}render();void pullStateFromServer();
</script>
</body></html>
