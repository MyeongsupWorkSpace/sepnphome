<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>견적 접수 확인 — 성은지기인쇄(주) | SEPNP Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <style>
      .admin-wrap { padding: 24px 0; }
      #quotesAdminTableWrap { overflow: hidden; }
      .quotes-admin-table { width: 100%; table-layout: fixed; border-collapse: collapse; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
      .quotes-admin-table th, .quotes-admin-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px; word-break: keep-all; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .quotes-admin-table th:nth-child(6),
      .quotes-admin-table td:nth-child(6) { overflow: visible; text-overflow: clip; }
      .quotes-admin-table .status-toggle { min-width: 120px; }
      .quotes-admin-table thead th { background: var(--bg-muted); text-align: left; color: var(--muted); }
      .quotes-admin-table tbody tr:hover { background: var(--bg-muted); }
      .quotes-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 12px 0; }
      .quotes-toolbar .field { display: inline-flex; align-items: center; gap: 6px; }
      .quotes-toolbar input, .quotes-toolbar select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; }
      .pager { display: flex; gap: 8px; justify-content: center; padding: 10px; border-top: 1px solid var(--border); background: var(--bg-elev); }
      .page-btn { padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; }
      .page-btn.active { background: var(--accent); color: var(--accent-contrast); border-color: transparent; font-weight: 700; box-shadow: 0 6px 16px rgba(140,47,57,0.18); }
      .status-toggle { display: inline-flex; gap: 6px; padding: 4px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-muted); }
      .status-toggle.is-busy { opacity: 0.65; pointer-events: none; }
      .status-btn { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: #fff; font-size: 12px; cursor: pointer; }
      .status-btn.is-active.status-pending { background: rgba(227,137,36,0.16); border-color: #e38924; color: #8a4b00; font-weight: 700; }
      .status-btn.is-active.status-done { background: rgba(46,125,50,0.16); border-color: #2e7d32; color: #1b5e20; font-weight: 700; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-top">
        <a href="../../index.html" class="logo" aria-label="홈으로 이동">
          <img src="../../assets/img/SE_logo.png" alt="SEPNP 로고" />
        </a>
      </div>
      <div class="container header-bottom">
        <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
        <nav class="site-nav" aria-label="주요">
          <ul>
            <li><a href="approvals.html">가입 승인 관리</a></li>
            <li class="nav-sep">|</li>
            <li><a href="#" data-menu="company">COMPANY</a></li>
            <li><a href="#" data-menu="products">PRODUCTS</a></li>
            <li><a href="../quote.html">견적문의</a></li>
          </ul>
        </nav>
        <div class="nav-actions" aria-label="계정 영역"></div>
      </div>
    </header>
    <main class="container admin-wrap admin-timeline">
      <h1 class="page-title">견적 접수 확인</h1>
      <div class="quotes-toolbar" aria-label="견적 관리 도구">
        <div class="field"><label for="qSearch">검색</label><input id="qSearch" placeholder="회사명/직급/성명/이메일/제품/요청사항" /></div>
        <div class="field"><label for="qStatus">상태</label>
          <select id="qStatus">
            <option value="">전체</option>
            <option value="문의중">문의중</option>
            <option value="답변완료">답변완료</option>
          </select>
        </div>
        <button class="btn" id="qRefresh">새로고침</button>
        <button class="btn" id="qExport">CSV 내보내기</button>
        <span id="qCount" class="muted ml-auto">0건</span>
      </div>
      <div id="quotesAdminTableWrap" class="admin-card-list" aria-live="polite">
        <div class="loading">견적 데이터를 불러오는 중…</div>
      </div>
      <div id="quotesPager" class="pager" aria-label="페이지 이동"></div>
    </main>
    <footer class="site-footer">
      <div class="footer-divider"></div>
      <div class="container footer-bottom">
        <div class="footer-bottom-inner">
          <div class="footer-meta">
            <div class="footer-links" aria-label="정책 링크">
              <a href="#" class="footer-link">개인정보처리방침</a>
              <span class="footer-sep">|</span>
              <a href="#" class="footer-link">이용약관</a>
              <span class="footer-sep">|</span>
              <a href="#" class="footer-link">문의하기</a>
            </div>
          </div>
          <div class="footer-copy">Copyright (c) <span id="year"></span> SEPNP. All Rights Reserved.</div>
        </div>
      </div>
    </footer>
    <script src="../../assets/js/main.js"></script>
  </body>
</html>
