<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>광고 팝업 관리 — 성은지기인쇄(주) | SEPNP Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <style>
      .settings { max-width: 720px; margin: 24px auto; display: grid; gap: 12px; }
      .field { display: grid; gap: 6px; }
      .field input, .field textarea { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; }
      .field textarea { min-height: 140px; }
      .field.inline { display: flex; align-items: center; gap: 10px; }
      .field.inline label { margin: 0; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-top">
        <a href="../../index.html" class="logo" aria-label="홈으로 이동">
          <img src="../../assets/img/SE_logo.png" alt="SEPNP 로고" />
        </a>
      </div>
      <div class="container header-bottom">
        <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
        <nav class="site-nav" aria-label="주요"><ul></ul></nav>
        <div class="nav-actions" aria-label="계정 영역"></div>
      </div>
    </header>
    <main class="container page-main">
      <div class="section-header stack">
        <h1 class="page-title section-title">광고 팝업 관리</h1>
        <p class="section-desc">홈페이지 첫 방문 팝업 내용을 수정합니다.</p>
      </div>
      <form class="settings" id="mainAdSettingsForm">
        <div class="field inline">
          <input id="mainAdEnabled" type="checkbox" />
          <label for="mainAdEnabled">팝업 표시</label>
        </div>
        <div class="field">
          <label for="mainAdTitle">제목</label>
          <input id="mainAdTitle" placeholder="🎉 SEPNP 특별 이벤트!" />
        </div>
        <div class="field">
          <label for="mainAdMessage">내용</label>
          <textarea id="mainAdMessage" placeholder="지금 회원가입 시 목형비 면제 쿠폰 증정!\n견적 문의도 빠르게!"></textarea>
        </div>
        <button id="saveMainAdSettings" class="btn btn-accent" type="button">저장</button>
        <p class="form-note" id="mainAdSettingsHint"></p>
      </form>
    </main>
    <footer class="site-footer">
      <div class="footer-divider"></div>
      <div class="container footer-bottom">
        <div class="footer-bottom-inner">
          <div class="footer-meta">
            <div class="footer-links" aria-label="정책 링크">
              <a href="#" class="footer-link">개인정보처리방침</a>
              <span class="footer-sep">|</span>
              <a href="#" class="footer-link">이용약관</a>
              <span class="footer-sep">|</span>
              <a href="#" class="footer-link">문의하기</a>
            </div>
          </div>
          <div class="footer-copy">Copyright (c) <span id="year"></span> SEPNP. All Rights Reserved.</div>
        </div>
      </div>
    </footer>
    <script src="../../assets/js/main.js"></script>
  </body>
  </html>
