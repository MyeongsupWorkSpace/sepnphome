<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>푸터 설정 — 성은지기인쇄(주) | SEPNP Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <style>
      .settings { max-width: 640px; margin: 24px auto; display: grid; gap: 12px; }
      .field { display: grid; gap: 6px; }
      .field input, .field textarea { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; }
      .field textarea { min-height: 100px; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-top">
        <a href="../../index.html" class="logo" aria-label="홈으로 이동">
          <img src="../../assets/img/SE_logo.png" alt="SEPNP 로고" />
        </a>
      </div>
      <div class="container header-bottom">
        <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
        <nav class="site-nav" aria-label="주요"><ul></ul></nav>
        <div class="nav-actions" aria-label="계정 영역"></div>
      </div>
    </header>
    <main class="container page-main">
      <div class="section-header stack">
        <h1 class="page-title section-title">푸터 설정</h1>
        <p class="section-desc">홈페이지 하단부 정보를 수정합니다.</p>
      </div>
      <form class="settings">
        <div class="field">
          <label for="company">회사명</label>
          <input id="company" placeholder="성은지기인쇄 주식회사" />
        </div>
        <div class="field">
          <label for="phone">연락처</label>
          <input id="phone" placeholder="031-986-8439" />
        </div>
        <div class="field">
          <label for="address">주소</label>
          <textarea id="address" placeholder="경기도 김포시 양촌읍 석모1로 212번길 100"></textarea>
        </div>
        <div class="field">
          <label for="email">대표 이메일</label>
          <input id="email" placeholder="thinking@sepnp.com" />
        </div>
        <div class="field">
          <label for="partnerEmail">제휴/협찬/유통 문의 이메일</label>
          <input id="partnerEmail" placeholder="thinking@sepnp.com" />
        </div>
        <div class="field">
          <label for="deliveryAddress">교환/반품 주소</label>
          <textarea id="deliveryAddress" placeholder="경기도 김포시 양촌읍 석모1로 212번길 100"></textarea>
        </div>
        <div class="field">
          <label for="hours">상담 가능 시간</label>
          <input id="hours" placeholder="월-금 : 09:30 ~ 17:00 / 점심시간 : 12:30 ~ 13:30" />
        </div>
        <div class="field">
          <label for="hoursNote">상담 휴무 안내</label>
          <input id="hoursNote" placeholder="(토/일/공휴일 휴무)" />
        </div>
        <div class="field">
          <label for="kakaoLink">카카오톡 문의 링크</label>
          <input id="kakaoLink" placeholder="https://pf.kakao.com/..." />
        </div>
        <button id="saveSettings" class="btn btn-accent" type="button">저장</button>
        <p class="form-note" id="settingsHint"></p>
      </form>
    </main>
    <footer class="site-footer">
      <div class="footer-divider"></div>
      <div class="container footer-bottom">
        <div class="footer-bottom-inner">
          <div class="footer-meta">
            <div class="footer-links" aria-label="정책 링크">
              <a href="#" class="footer-link">개인정보처리방침</a>
              <span class="footer-sep">|</span>
              <a href="#" class="footer-link">이용약관</a>
              <span class="footer-sep">|</span>
              <a href="#" class="footer-link">문의하기</a>
            </div>
          </div>
          <div class="footer-copy">Copyright (c) <span id="year"></span> SEPNP. All Rights Reserved.</div>
        </div>
      </div>
    </footer>
    <script src="../../assets/js/main.js"></script>
  </body>
  </html>
