<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원 관리 — SEPNP Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <style>
      .table { width: 100%; border-collapse: collapse; }
      .table th, .table td { border: 1px solid var(--border); padding: 10px; }
      .actions { display: flex; gap: 8px; }
      .admin-toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin: 12px 0; }
      .admin-toolbar input { padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; min-width: 220px; }
      .admin-user-tabs { display: flex; gap: 8px; margin: 10px 0 4px; flex-wrap: wrap; }
      .admin-tab { padding: 8px 14px; border: 1px solid var(--border); border-radius: 999px; background: #fff; cursor: pointer; font-weight: 600; }
      .admin-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-top">
        <a href="../../index.html" class="logo" aria-label="홈으로 이동">
          <img src="../../assets/img/SE_logo.png" alt="SEPNP 로고" />
        </a>
      </div>
      <div class="container header-bottom">
        <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
        <nav class="site-nav" aria-label="주요"><ul></ul></nav>
        <div class="nav-actions" aria-label="계정 영역"></div>
      </div>
    </header>
    <main class="container page-main">
      <h1 class="page-title">회원 관리</h1>
      <p>가입한 회원의 상태를 관리합니다. (정상/일시정지/정지)</p>
      <div class="admin-user-tabs" role="tablist" aria-label="사용자 분류">
        <button type="button" class="admin-tab active" data-user-tab="all" role="tab" aria-selected="true">전체</button>
        <button type="button" class="admin-tab" data-user-tab="customer" role="tab" aria-selected="false">고객</button>
        <button type="button" class="admin-tab" data-user-tab="employee" role="tab" aria-selected="false">직원</button>
      </div>
      <div class="admin-toolbar">
        <label for="userSearch" class="is-hidden">회원 검색</label>
        <input id="userSearch" placeholder="아이디/닉네임/상태 검색" />
      </div>
      <div class="board-list admin-fixed">
        <table class="table" id="usersTable">
          <thead>
            <tr><th>아이디</th><th>닉네임</th><th>상태</th><th>조치</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
    <footer class="site-footer">
      <div class="footer-divider"></div>
      <div class="container footer-bottom">
        <div class="footer-bottom-inner">
          <div class="footer-meta">
            <div class="footer-links" aria-label="정책 링크">
              <a href="#" class="footer-link">개인정보처리방침</a>
              <span class="footer-sep">|</span>
              <a href="#" class="footer-link">이용약관</a>
              <span class="footer-sep">|</span>
              <a href="#" class="footer-link">문의하기</a>
            </div>
          </div>
          <div class="footer-copy">Copyright (c) <span id="year"></span> SEPNP. All Rights Reserved.</div>
        </div>
      </div>
    </footer>
    <script src="../../assets/js/main.js"></script>
  </body>
</html>
