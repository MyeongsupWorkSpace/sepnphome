<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>업체별 제품 관리 — 성은지기인쇄(주) | SEPNP Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <style>
      .vendor-admin { display: grid; gap: 18px; }
      .vendor-grid { display: grid; gap: 16px; grid-template-columns: 1fr 1.2fr; }
      .vendor-card { padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-elev); box-shadow: var(--shadow-sm); }
      .vendor-card h2 { margin: 0 0 12px; font-size: 18px; }
      .field { display: grid; gap: 6px; margin-bottom: 10px; }
      .field input, .field textarea, .field select { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; }
      .field textarea { min-height: 90px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      .hint { font-size: 13px; color: var(--muted); min-height: 18px; }
      .hint.ok { color: #1a7f37; }
      .hint.error { color: #b42318; }
      .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
      .admin-table th, .admin-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; }
      .admin-table th { background: var(--bg-muted); }
      .thumb { width: 60px; height: 44px; object-fit: cover; border-radius: 8px; background: var(--bg-muted); border: 1px solid var(--border); }
      .readonly { opacity: 0.5; pointer-events: none; }
      @media (max-width: 980px) { .vendor-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-top">
        <a href="../../index.html" class="logo" aria-label="홈으로 이동">
          <img src="../../assets/img/SE_logo.png" alt="SEPNP 로고" />
        </a>
      </div>
      <div class="container header-bottom">
        <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
        <nav class="site-nav" aria-label="주요"><ul></ul></nav>
        <div class="nav-actions" aria-label="계정 영역"></div>
      </div>
    </header>

    <main class="container page-main">
      <div class="section-header stack">
        <h1 class="page-title section-title">업체별 제품 관리</h1>
        <p class="section-desc">업체와 제품 정보를 등록/수정합니다.</p>
      </div>

      <section class="vendor-admin">
        <div class="vendor-grid">
          <div class="vendor-card" id="brandPanel">
            <h2>거래처(업체) 관리</h2>
            <div class="field">
              <label for="brandName">업체명</label>
              <input id="brandName" placeholder="업체명 입력" />
            </div>
            <div class="field">
              <label for="brandSlug">코드(슬러그)</label>
              <input id="brandSlug" placeholder="자동 생성됩니다" />
            </div>
            <div class="field">
              <label for="brandSort">정렬 순서</label>
              <input id="brandSort" type="number" value="0" />
            </div>
            <div class="row">
              <button class="btn btn-accent" type="button" id="brandSave">업체 저장</button>
              <button class="btn" type="button" id="brandReset">초기화</button>
              <button class="btn" type="button" id="vendorSyncImages">기존 이미지 불러오기</button>
            </div>
            <div class="hint" id="brandHint"></div>
            <div class="field">
              <label>등록된 업체</label>
              <div class="notice-table-wrap">
                <table class="admin-table" id="brandTable">
                  <thead>
                    <tr><th>업체명</th><th>코드</th><th>정렬</th><th>관리</th></tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="vendor-card" id="productPanel">
            <h2>제품 관리</h2>
            <div class="field">
              <label for="productBrand">업체 선택</label>
              <select id="productBrand"></select>
            </div>
            <div class="field">
              <label for="productName">제품명</label>
              <input id="productName" placeholder="제품명 입력" />
            </div>
            <div class="field">
              <label for="productDesc">설명</label>
              <textarea id="productDesc" placeholder="제품 설명"></textarea>
            </div>
            <div class="field">
              <label for="productImage">이미지 파일</label>
              <input id="productImage" type="file" accept="image/*" />
              <input id="productImageUrl" placeholder="업로드 후 자동 입력" />
            </div>
            <div class="field">
              <label for="productSort">정렬 순서</label>
              <input id="productSort" type="number" value="0" />
            </div>
            <div class="row">
              <button class="btn btn-accent" type="button" id="productSave">제품 저장</button>
              <button class="btn" type="button" id="productReset">초기화</button>
            </div>
            <div class="hint" id="productHint"></div>
            <div class="field">
              <label>등록된 제품</label>
              <div class="notice-table-wrap">
                <table class="admin-table" id="productTable">
                  <thead>
                    <tr><th>이미지</th><th>업체</th><th>제품명</th><th>정렬</th><th>관리</th></tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-divider"></div>
      <div class="container footer-bottom">
        <div class="footer-bottom-inner">
          <div class="footer-meta">
            <div class="footer-links" aria-label="정책 링크">
              <a href="#" class="footer-link">개인정보처리방침</a>
              <span class="footer-sep">|</span>
              <a href="#" class="footer-link">이용약관</a>
              <span class="footer-sep">|</span>
              <a href="#" class="footer-link">문의하기</a>
            </div>
          </div>
          <div class="footer-copy">Copyright (c) <span id="year"></span> SEPNP. All Rights Reserved.</div>
        </div>
      </div>
    </footer>

    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/vendor-products-admin.js"></script>
  </body>
</html>
