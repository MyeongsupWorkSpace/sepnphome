    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-top">
        <a href="../index.html" class="logo" aria-label="홈으로 이동">
          <img src="../assets/img/SE_logo.png" alt="SEPNP 로고" />
        </a>
      </div>
      <div class="container header-bottom">
        <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
        <nav class="site-nav" aria-label="주요">
          <ul>
            <li><a href="about.html">회사소개</a></li>
            <li><a href="facility.html">시설 및 공정</a></li>
            <li><a href="products.html" aria-current="page">제품소개</a></li>

          </ul>
        </nav>
        <div class="nav-actions" aria-label="계정 영역"></div>

    <main class="container page-main">
      <section class="products-hero is-hidden" id="type-view">
        <div class="section-header stack">
          <h1 class="page-title section-title">제품소개</h1>
          <p class="section-desc">분야별 제작 노하우를 담은 핵심 제품군을 소개합니다. 이미지와 상세 페이지는 필요에 따라 교체하세요.</p>
          <span class="section-subtle">아래 카드를 클릭하면 상세 페이지로 이동합니다.</span>
        </div>
        <div class="tab-bar" role="tablist" aria-label="타입별 제품 탭" data-tab-group="type">
          <button class="tab-btn is-active" type="button" role="tab" aria-selected="true" data-tab-target="color-box">칼라박스</button>
          <button class="tab-btn" type="button" role="tab" aria-selected="false" data-tab-target="corrugated">골판지 박스</button>
          <button class="tab-btn" type="button" role="tab" aria-selected="false" data-tab-target="special">특수인쇄</button>
          <button class="tab-btn" type="button" role="tab" aria-selected="false" data-tab-target="commercial">상업인쇄</button>
          <button class="tab-btn" type="button" role="tab" aria-selected="false" data-tab-target="shopping-bag">쇼핑백</button>
          <button class="tab-btn" type="button" role="tab" aria-selected="false" data-tab-target="etc">기타</button>
        </div>
      </section>

      <section class="tab-panel is-active is-hidden" data-tab-panel="color-box" data-tab-group="type" aria-label="칼라박스">
        <div class="product-embed">
          <iframe class="product-iframe" src="products/color-box.html" title="칼라박스" loading="lazy" scrolling="no"></iframe>
        </div>
      </section>

      <section class="tab-panel is-hidden" data-tab-panel="corrugated" data-tab-group="type" aria-label="골판지 박스">
        <div class="product-embed">
          <iframe class="product-iframe" src="products/corrugated-box.html" title="골판지 박스" loading="lazy" scrolling="no"></iframe>
        </div>
      </section>

      <section class="tab-panel is-hidden" data-tab-panel="special" data-tab-group="type" aria-label="특수인쇄">
        <div class="product-embed">
          <iframe class="product-iframe" src="products/special-printing.html" title="특수인쇄" loading="lazy" scrolling="no"></iframe>
        </div>
      </section>

      <section class="tab-panel is-hidden" data-tab-panel="commercial" data-tab-group="type" aria-label="상업인쇄">
        <div class="product-embed">
          <iframe class="product-iframe" src="products/commercial-printing.html" title="상업인쇄" loading="lazy" scrolling="no"></iframe>
        </div>
      </section>

      <section class="tab-panel is-hidden" data-tab-panel="shopping-bag" data-tab-group="type" aria-label="쇼핑백">
        <div class="product-embed">
          <iframe class="product-iframe" src="products/shopping-bag.html" title="쇼핑백" loading="lazy" scrolling="no"></iframe>
        </div>
      </section>

      <section class="tab-panel is-hidden" data-tab-panel="etc" data-tab-group="type" aria-label="기타">
        <div class="product-embed">
          <iframe class="product-iframe" src="products/etc.html" title="기타" loading="lazy" scrolling="no"></iframe>
        </div>
      </section>
